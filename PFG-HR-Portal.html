const certState = (e, c) => { const cert = DB.certs.filter(x=>x.emp===e.id && x.course===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0]; if(!cert) return {s:'Missing',c:'bad'}; const exp = D.iso(new Date(+cert.date.slice(0,4), +cert.date.slice(5,7)-1+c.months, +cert.date.slice(8,10), 12)); const left = D.diff(D.todayIso(), exp); return left<0 ? {s:'Expired '+fmtS(exp),c:'bad'} : left<=60 ? {s:'Due '+fmtS(exp),c:'warn'} : {s:'Valid to '+fmtS(exp),c:'ok'}; };
VIEWS.training = () => {
  const tabs = [['reg','Register'],['ses','Sessions'],['lib','Video library'],['comp','Competencies'],['kpi','KPIs']], k = tabOf('tr','reg'); let body = '';
  const people = isMgr() ? visibleEmps().filter(e=>e.status==='active') : [me()];
  if(k==='reg') body = `<div class="toolbar"><span class="grow"></span>${isHR()?`<button class="btn" data-act="addCert">${ico('plus')} Record certificate</button><button class="btn" data-act="addCourse">${ico('plus')} Add course</button>`:''}</div><div class="tw"><table class="t"><thead><tr><th>Employee</th>${DB.courses.map(c=>`<th>${esc(c.name)}${c.mandatory?' *':''}</th>`).join('')}</tr></thead><tbody>${people.map(e=>`<tr><td><b>${esc(e.name)}</b></td>${DB.courses.map(c=>{ const s = certState(e,c); return `<td>${badge(s.s,s.c)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:8px">* Mandatory. Validity periods (${DB.courses.map(c=>c.name+' '+c.months+'m').join(', ')}) are configurable placeholders.</p>`;
  if(k==='ses') body = `<div class="toolbar"><span class="grow"></span>${isHR()?`<button class="btn pri" data-act="newSession">${ico('plus')} Schedule training</button>`:''}</div><div class="grid g2">${DB.sessions.filter(s=>isHR()||s.invited.includes(SESSION.uid)||isMgr()).map(s=>{ const c = DB.courses.find(x=>x.id===s.course), inv = s.invited.includes(SESSION.uid); return `<div class="card"><div class="row sp"><b>${esc(c.name)}</b>${badge(fmtS(s.date)+' '+s.time,'info')}</div><div class="small muted" style="margin:4px 0 10px">${esc(s.loc)} · ${esc(s.trainer)}</div><div class="small">Invited (${s.invited.length}): ${s.invited.map(i=>esc(empName(i))).join(', ')}</div><div class="small" style="margin-top:6px">Declarations signed: <b>${Object.keys(s.declared).length}</b> / ${s.invited.length}</div><div class="row wrap" style="margin-top:12px"><button class="btn sm" data-act="sesIcs" data-id="${s.id}">${ico('cal')} Add to calendar</button>${inv&&!s.declared[SESSION.uid]?`<button class="btn sm pri" data-act="declare" data-id="${s.id}">Sign trainee declaration</button>`:inv?badge('Declaration signed','ok'):''}</div></div>`; }).join('')||'<div class="empty">No sessions scheduled.</div>'}</div>`;
  if(k==='lib') body = `<div class="toolbar"><span class="grow"></span>${isHR()?`<button class="btn" data-act="remindVideos">${ico('bell')} Weekly reminder to non-viewers</button><button class="btn pri" data-act="addVideo">${ico('up')} Add video</button>`:''}</div><div class="grid g3">${DB.videos.map(v=>`<div class="card"><div style="aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px;cursor:pointer" data-act="playVideo" data-id="${v.id}">${ico('video')}</div><b>${esc(v.title)}</b><div class="small muted">${esc(v.cat)} · ${v.len}</div><div class="row sp" style="margin-top:8px">${v.seen[SESSION.uid]?badge('Viewed','ok'):badge('Not viewed','warn')}<span class="small muted">${Object.keys(v.seen).length} views</span></div></div>`).join('')}</div>`;
  if(k==='comp') body = `<div class="toolbar"><span class="grow"></span>${isMgr()?`<button class="btn pri" data-act="newComp">${ico('plus')} New assessment</button>`:''}</div>${table([{h:'Employee',f:c=>esc(empName(c.emp))},{h:'Job description',f:c=>esc(c.jd)},{h:'Date',f:c=>fmt(c.date)},{h:'Scores',f:c=>Object.entries(c.scores).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join('')},{h:'Average',f:c=>'<b>'+(Object.values(c.scores).reduce((a,b)=>a+b,0)/Object.keys(c.scores).length).toFixed(1)+'</b>'},{h:'Training plan',f:c=>esc(c.plan)}], DB.competencies.filter(c=>isHR()||c.emp===SESSION.uid||manageable().some(m=>m.id===c.emp)))}`;
  if(k==='kpi'){ DB.kpis ||= []; body = `<div class="toolbar"><span class="grow"></span>${isMgr()?`<button class="btn pri" data-act="newKpi">${ico('plus')} Add KPI</button>`:''}</div><div class="grid g2">${DB.kpis.filter(x=>isHR()||x.emp===SESSION.uid||manageable().some(m=>m.id===x.emp)).map(x=>{ const p = Math.min(100,Math.round(x.actual/x.target*100)); return `<div class="card"><div class="row sp"><b>${esc(x.title)}</b>${badge(p+'%',p>=100?'ok':p>=60?'warn':'bad')}</div><div class="small muted">${esc(empName(x.emp))} · ${esc(x.period)}</div><div class="prog ${p>=100?'g':p>=60?'o':'r'}" style="margin:10px 0"><i style="width:${p}%"></i></div><div class="row sp small"><span>Actual ${x.actual}</span><span>Target ${x.target}</span></div>${isMgr()?`<button class="btn sm" style="margin-top:8px" data-act="kpiUpd" data-id="${x.id}">Update actual</button>`:''}</div>`; }).join('')||'<div class="empty">No KPIs set.</div>'}</div>`; }
  return pageHead('Training & Development','Mandatory training register, scheduling with auto-invites, video library, competencies and KPIs.') + tabsHtml('tr',tabs,'reg') + body;
};

ACT.newSession = () => modal({title:'Schedule training',size:'wide',body:`<form id="sf2"><div class="fgrid"><div class="field"><label>Course</label><select name="c">${DB.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Trainer / provider</label><input name="t"></div><div class="field"><label>Date</label><input type="date" name="d" min="${D.todayIso()}"></div><div class="field"><label>Time</label><input type="time" name="h" value="10:00"></div><div class="field full"><label>Location / Teams link</label><input name="l"></div><div class="field full"><label>Invite employees (auto-invites sent on save)</label><div class="grid g3" style="max-height:170px;overflow:auto">${DB.emps.filter(e=>e.status==='active').map(e=>`<label class="row" style="margin:0;gap:6px;font-weight:500"><input type="checkbox" style="width:auto" name="inv" value="${e.id}"> ${esc(e.name)}</label>`).join('')}</div></div></div><div id="sfe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Schedule & invite',cls:'pri',act:'saveSession'}]});
ACT.saveSession = el => submitOnce(el, () => { const f = $('#sf2'), inv = $$('input[name=inv]:checked',f).map(x=>x.value), er = $('#sfe'); if(!f.d.value || !f.l.value.trim() || !inv.length){ er.textContent='Choose a date, a location and at least one attendee.'; er.classList.add('show'); return; }
  const s = {id:uid('ts'),course:f.c.value,date:f.d.value,time:f.h.value,loc:f.l.value.trim(),invited:inv,trainer:f.t.value.trim()||'TBC',declared:{}}; DB.sessions.push(s); const c = DB.courses.find(x=>x.id===s.course); notify(inv, `You are invited to ${c.name} on ${fmt(s.date)} at ${s.time}. Please sign the trainee declaration.`, 'training'); log('Training scheduled',`${c.name} ${s.date} (${inv.length} invited)`); saveDB(); closeModal(); toast(`Invites sent to ${inv.length} employee(s)`,'ok'); render(); });
ACT.sesIcs = el => { const s = DB.sessions.find(x=>x.id===el.dataset.id), c = DB.courses.find(x=>x.id===s.course), d = s.date.replace(/-/g,''), t = s.time.replace(':',''); fileDownload('training_'+c.name.replace(/\W/g,'_')+'.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PFG HRMS//EN\r\nBEGIN:VEVENT\r\nUID:${s.id}@pfg-hrms\r\nDTSTAMP:${d}T000000Z\r\nDTSTART:${d}T${t}00\r\nDURATION:PT2H\r\nSUMMARY:${c.name}\r\nLOCATION:${s.loc}\r\nEND:VEVENT\r\nEND:VCALENDAR`,'text/calendar'); };
ACT.declare = el => modal({title:'Trainee declaration',body:`<p class="small">I confirm that I attended and completed this training, that I understand its content, and that I will follow the procedures taught.</p><div class="field"><label>Type your full name to sign</label><input id="dcn" placeholder="${esc(me().name)}"></div>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Sign declaration',cls:'pri',act:'declSave',data:`data-id="${el.dataset.id}"`}]});
ACT.declSave = el => { if($('#dcn').value.trim().toLowerCase()!==me().name.toLowerCase()) return toast('Type your name exactly as shown.','bad'); const s = DB.sessions.find(x=>x.id===el.dataset.id); s.declared[SESSION.uid] = nowStamp(); log('Training declaration signed',s.id); saveDB(); closeModal(); render(); };
ACT.addVideo = () => modal({title:'Add training / company video',body:`<form id="vf"><div class="fgrid"><div class="field full"><label>Title</label><input name="t"></div><div class="field"><label>Category</label><select name="c"><option>Induction</option><option>Health & Safety</option><option>Portal</option><option>Company</option></select></div><div class="field"><label>Length (mm:ss)</label><input name="l" placeholder="5:00"></div><div class="field full"><label>Video link (Stream / SharePoint / YouTube) or file (≤ 1 MB demo)</label><input name="u" placeholder="https://…"><input type="file" accept="video/*" data-chg="vidFile" style="margin-top:8px"></div></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Add',cls:'pri',act:'saveVideo'}]});
CHG.vidFile = el => { const f = el.files[0]; if(!f) return; if(f.size>1024*1024){ toast('Prototype limit is 1 MB – use a link for larger files.','bad'); el.value=''; return; } const r = new FileReader(); r.onload = () => { window.__vid = r.result; toast('File ready'); }; r.readAsDataURL(f); };
ACT.saveVideo = () => { const f = $('#vf'), u = f.u.value.trim(); if(f.t.value.trim().length<3) return toast('Enter a title.','bad'); if(u && !/^https:\/\//.test(u)) return toast('Links must start with https://','bad'); if(!u && !window.__vid) return toast('Add a link or a file.','bad'); DB.videos.push({id:uid('v'),title:f.t.value.trim(),cat:f.c.value,len:f.l.value||'—',src:u||window.__vid,seen:{}}); window.__vid = null; log('Video added',f.t.value); saveDB(); closeModal(); render(); };
ACT.playVideo = el => { const v = DB.videos.find(x=>x.id===el.dataset.id); v.seen[SESSION.uid] = D.todayIso(); saveDB(); const play = v.src.startsWith('data:video') ? `<video controls autoplay style="width:100%;border-radius:10px" src="${v.src}"></video>` : v.src ? `<p>Opens the video in a new tab:</p><a class="btn pri" target="_blank" rel="noopener noreferrer" href="${esc(v.src)}">Open video</a>` : `<div class="empty">Sample entry – no media attached yet.</div>`; modal({title:esc(v.title),body:play,actions:[{label:'Close',act:'closeModal'}]}); };
ACT.remindVideos = () => { let n = 0; DB.videos.forEach(v => DB.emps.filter(e=>e.status==='active' && !v.seen[e.id]).forEach(e => { notify(e.id, `Reminder: please watch “${v.title}”.`, 'training'); n++; })); log('Video reminders sent',n+' reminders'); saveDB(); toast(`${n} reminders sent`,'ok'); };
ACT.newComp = () => { const ppl = manageable().filter(e=>e.status==='active'); modal({title:'Competency assessment',body:`<form id="cpf"><div class="fgrid"><div class="field"><label>Employee</label><select name="e">${empOptions(ppl)}</select></div><div class="field"><label>Linked job description</label><input name="jd" placeholder="Job title"></div>${['Customer focus','Commercial awareness','Communication','Planning'].map(k=>`<div class="field"><label>${k} (1–5)</label><select name="${k}">${[1,2,3,4,5].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}<div class="field full"><label>Linked training plan</label><input name="p"></div></div><p class="small muted">Rate role-relevant behaviours using evidence only.</p></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Submit',cls:'pri',act:'saveComp'}]}); };
ACT.saveComp = () => { const f = $('#cpf'); if(!f.jd.value.trim()) return toast('Enter the linked job description.','bad'); DB.competencies.push({id:uid('cp'),emp:f.e.value,by:me().id,date:D.todayIso(),jd:f.jd.value.trim(),scores:Object.fromEntries(['Customer focus','Commercial awareness','Communication','Planning'].map(k=>[k,+f[k].value])),plan:f.p.value.trim()||'—'}); log('Competency assessment',f.e.value,f.e.value); saveDB(); closeModal(); render(); };
ACT.newKpi = () => modal({title:'Add KPI',body:`<form id="kf"><div class="fgrid"><div class="field full"><label>Employee</label><select name="e">${empOptions(manageable().filter(e=>e.status==='active'))}</select></div><div class="field full"><label>KPI</label><input name="t"></div><div class="field"><label>Target</label><input type="number" name="g" min="1" step="any"></div><div class="field"><label>Actual</label><input type="number" name="a" min="0" step="any" value="0"></div><div class="field full"><label>Period</label><input name="p" value="${MONTHS[D.today().getMonth()]} ${D.today().getFullYear()}"></div></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Save',cls:'pri',act:'saveKpi'}]});
ACT.saveKpi = () => { const f = $('#kf'); if(!f.t.value.trim() || !(+f.g.value>0)) return toast('Enter a KPI and a positive target.','bad'); (DB.kpis ||= []).push({id:uid('k'),emp:f.e.value,title:f.t.value.trim(),target:+f.g.value,actual:+f.a.value||0,period:f.p.value}); saveDB(); closeModal(); render(); };
ACT.kpiUpd = el => { const k = DB.kpis.find(x=>x.id===el.dataset.id); const v = prompt('New actual value', k.actual); if(v!==null && !isNaN(+v) && +v>=0){ k.actual = +v; saveDB(); render(); } };

/* ---------------- POLICIES ---------------- */
VIEWS.policies = (param) => {
  if(param && DB.policies.find(p=>p.id===param)) setTimeout(()=>{ history.replaceState(null,'','#/policies'); policyModal(param); },0);
  const q = ST.f.pq||'', cat = ST.f.pcat||'', list = DB.policies.filter(p => (!cat||p.cat===cat) && (!q || (p.title+p.body).toLowerCase().includes(q.toLowerCase())));
  const acked = id => DB.ack[id]?.[SESSION.uid];
  return pageHead('Policies & SOPs','Published versions, read-receipts and reminders. Ask the policy assistant to find the right policy.',`${isHR()?`<button class="btn pri" data-act="newPolicy">${ico('plus')} Publish policy / SOP</button>`:''}`) +
  `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#f3f6ff,#fff)"><h3><span class="l">${ico('search')} Policy assistant</span></h3><div class="row"><input type="search" id="pbot" placeholder="Type a word, e.g. carry-over, sickness, probation, COSHH" value="${esc(q)}" data-inp="pq" style="flex:1"><button class="btn pri" data-act="pbotGo">Find</button></div><p class="small muted" style="margin:8px 0 0">Searches published text and shows the relevant sentences with links. This is keyword search, not legal advice.</p>${q?`<div style="margin-top:12px">${list.map(p=>{ const sents = p.body.split(/(?<=\.)\s+/).filter(s=>s.toLowerCase().includes(q.toLowerCase())); return `<div class="li" style="align-items:flex-start"><div class="grow"><a href="#" data-act="openPolicy" data-id="${p.id}"><b>${esc(p.title)}</b></a> <span class="small muted">v${p.ver}</span>${sents.map(s=>`<div class="small">“…${esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`)}”</div>`).join('')}</div></div>`; }).join('')||'<div class="muted">No matching policy. Contact HR.</div>'}</div>`:''}</div>
  <div class="toolbar"><select data-chg="pcat"><option value="">All types</option><option ${cat==='Policy'?'selected':''}>Policy</option><option ${cat==='SOP'?'selected':''}>SOP</option></select></div>` +
  table([{h:'Document',f:p=>`<b>${esc(p.title)}</b><div class="small muted">${p.cat} · owner ${esc(p.owner)} · audience ${esc(p.aud)}</div>`},{h:'Version',f:p=>'v'+p.ver},{h:'Published',f:p=>fmt(p.date)},{h:'Acknowledged',f:p=>isHR()?`${Object.keys(DB.ack[p.id]||{}).length} / ${DB.emps.filter(e=>e.status==='active').length}`:(acked(p.id)?badge('Read '+fmtS(acked(p.id)),'ok'):badge('Action needed','warn'))},{h:'',cls:'right nowrap',f:p=>`<button class="btn sm" data-act="openPolicy" data-id="${p.id}">Open</button>${isHR()?` <button class="btn sm" data-act="remindPolicy" data-id="${p.id}">Remind</button>`:''}`}], list);
};
CHG.pq = el => { ST.f.pq = el.value; render(); const f = $('#pbot'); f.focus(); f.setSelectionRange(f.value.length,f.value.length); };
CHG.pcat = el => { ST.f.pcat = el.value; render(); };
ACT.pbotGo = () => { ST.f.pq = $('#pbot').value.trim(); render(); };
function policyModal(id){ const p = DB.policies.find(x=>x.id===id), a = DB.ack[id]?.[SESSION.uid];
  modal({title:esc(p.title),size:'wide',body:`<div class="row wrap" style="margin-bottom:10px">${badge(p.cat)} ${badge('v'+p.ver,'info')} <span class="small muted">Published ${fmt(p.date)} · owner ${esc(p.owner)}</span></div><p style="line-height:1.7">${esc(p.body)}</p>${isHR()?`<h4 style="margin-top:14px">Read receipts</h4><div class="small">${DB.emps.filter(e=>e.status==='active').map(e=>`<span class="tag" style="${DB.ack[id]?.[e.id]?'background:var(--ok-l);color:var(--ok)':''}">${esc(e.name)} ${DB.ack[id]?.[e.id]?'✓':'–'}</span>`).join('')}</div>`:''}`,actions:[{label:'Close',act:'closeModal'},a?{label:'Acknowledged '+fmt(a),act:'closeModal'}:{label:'I have read and understood this',cls:'pri',act:'ack',data:`data-id="${id}"`}]}); }
ACT.openPolicy = el => policyModal(el.dataset.id);
ACT.ack = el => { (DB.ack[el.dataset.id] ||= {})[SESSION.uid] = D.todayIso(); log('Policy acknowledged',el.dataset.id); saveDB(); closeModal(); toast('Acknowledgement recorded','ok'); render(); };
ACT.remindPolicy = el => { const p = DB.policies.find(x=>x.id===el.dataset.id), t = DB.emps.filter(e=>e.status==='active' && !DB.ack[p.id]?.[e.id]); notify(t.map(e=>e.id), `Please read and acknowledge: ${p.title}`, 'policies'); log('Policy reminder',p.title+' → '+t.length); saveDB(); toast(`Reminder sent to ${t.length} employee(s)`,'ok'); };
ACT.newPolicy = () => modal({title:'Publish policy / SOP',size:'wide',body:`<form id="pf"><div class="fgrid"><div class="field full"><label>Title (re-use an existing title to publish a new version)</label><input name="t"></div><div class="field"><label>Type</label><select name="c"><option>Policy</option><option>SOP</option></select></div><div class="field"><label>Version</label><input name="v" value="1.0"></div><div class="field"><label>Owner</label><input name="o" value="HR"></div><div class="field"><label>Audience</label><select name="a"><option>All</option><option>Managers</option><option>HR</option></select></div><div class="field full"><label>Content</label><textarea name="b" style="min-height:140px"></textarea></div></div><div id="pfe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Publish',cls:'pri',act:'savePolicy'}]});
ACT.savePolicy = () => { const f = $('#pf'), er = $('#pfe'); if(f.t.value.trim().length<3 || f.b.value.trim().length<20 || !/^\d+(\.\d+)*$/.test(f.v.value.trim())){ er.textContent='Title, content (20+ characters) and a numeric version (e.g. 1.1) are required.'; er.classList.add('show'); return; }
  const ex = DB.policies.find(p=>p.title.toLowerCase()===f.t.value.trim().toLowerCase()); if(ex){ ex.ver = f.v.value.trim(); ex.body = f.b.value.trim(); ex.date = D.todayIso(); DB.ack[ex.id] = {}; } else DB.policies.push({id:uid('p'),title:f.t.value.trim(),cat:f.c.value,ver:f.v.value.trim(),date:D.todayIso(),status:'Published',owner:f.o.value,aud:f.a.value,body:f.b.value.trim()});
  notify(DB.emps.filter(e=>e.status==='active').map(e=>e.id), `New ${f.c.value.toLowerCase()} published: ${f.t.value.trim()}`, 'policies'); log('Policy published',f.t.value+' v'+f.v.value); saveDB(); closeModal(); toast('Published and circulated','ok'); render(); };

/* ---------------- FORMS ---------------- */
VIEWS.forms = () => pageHead('Forms','Build simple forms (like MS Forms), share them in the portal and view responses.',`${isMgr()?`<button class="btn pri" data-act="newForm">${ico('plus')} Create form</button>`:''}`) +
  `<div class="grid g3">${DB.forms.map(f=>`<div class="card"><b>${esc(f.title)}</b><div class="small muted" style="margin:4px 0 10px">${esc(f.desc)}</div><div class="small">${f.fields.length} questions · ${f.responses.length} responses</div><div class="row wrap" style="margin-top:12px"><button class="btn sm pri" data-act="fillForm" data-id="${f.id}">${f.responses.some(r=>r.who===SESSION.uid)?'Submitted – view':'Fill in'}</button>${isMgr()?`<button class="btn sm" data-act="formResp" data-id="${f.id}">Responses</button>`:''}</div></div>`).join('')}</div>`;
ACT.newForm = () => { window.__ff = []; modal({title:'Create form',size:'wide',body:`<form id="fb" onsubmit="return false"><div class="fgrid"><div class="field"><label>Title</label><input name="t"></div><div class="field"><label>Description</label><input name="d"></div></div><h4>Questions</h4><div id="fq" class="small muted" style="margin:6px 0">No questions yet.</div><div class="fgrid"><div class="field"><label>Question</label><input id="qq1"></div><div class="field"><label>Type</label><select id="qt"><option value="text">Short text</option><option value="choice">Choice</option><option value="rating">Rating 1–5</option><option value="check">Checkbox</option></select></div><div class="field full"><label>Choices (comma-separated, for Choice)</label><input id="qo"></div></div><button class="btn sm" data-act="addQ">${ico('plus')} Add question</button></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Create form',cls:'pri',act:'saveForm'}]}); };
ACT.addQ = () => { const l = $('#qq1').value.trim(), t = $('#qt').value, o = $('#qo').value.trim(); if(!l) return toast('Enter the question.','bad'); if(t==='choice' && o.split(',').filter(x=>x.trim()).length<2) return toast('Give at least two choices.','bad'); window.__ff.push({k:'q'+window.__ff.length,label:l,type:t,opts:o}); $('#qq1').value=''; $('#qo').value=''; $('#fq').innerHTML = window.__ff.map((q,i)=>`${i+1}. ${esc(q.label)} <span class="tag">${q.type}</span>`).join('<br>'); };
ACT.saveForm = () => { const f = $('#fb'); if(f.t.value.trim().length<3 || !window.__ff.length) return toast('Add a title and at least one question.','bad'); DB.forms.push({id:uid('f'),title:f.t.value.trim(),desc:f.d.value.trim(),by:SESSION.uid,fields:window.__ff,responses:[]}); log('Form created',f.t.value); saveDB(); closeModal(); render(); };
ACT.fillForm = el => { const f = DB.forms.find(x=>x.id===el.dataset.id), r = f.responses.find(x=>x.who===SESSION.uid);
  modal({title:esc(f.title),body:`<p class="muted">${esc(f.desc)}</p><form id="ff" onsubmit="return false">${f.fields.map(q=>`<div class="field"><label>${esc(q.label)}</label>${q.type==='text'?`<textarea name="${q.k}" ${r?'disabled':''}>${esc(r?.a[q.k]||'')}</textarea>`:q.type==='choice'?`<select name="${q.k}" ${r?'disabled':''}>${q.opts.split(',').map(o=>`<option ${r?.a[q.k]===o.trim()?'selected':''}>${esc(o.trim())}</option>`).join('')}</select>`:q.type==='rating'?`<select name="${q.k}" ${r?'disabled':''}>${[5,4,3,2,1].map(n=>`<option ${r?.a[q.k]==n?'selected':''}>${n}</option>`).join('')}</select>`:`<select name="${q.k}" ${r?'disabled':''}><option>No</option><option ${r?.a[q.k]==='Yes'?'selected':''}>Yes</option></select>`}</div>`).join('')}</form>`,actions:[{label:'Close',act:'closeModal'},...(r?[]:[{label:'Submit',cls:'pri',act:'submitForm',data:`data-id="${f.id}"`}])]}); };
ACT.submitForm = el => submitOnce(el, () => { const f = DB.forms.find(x=>x.id===el.dataset.id); if(f.responses.some(r=>r.who===SESSION.uid)) return; const a = {}; f.fields.forEach(q=>a[q.k] = $('#ff')[q.k].value); f.responses.push({who:SESSION.uid,t:D.todayIso(),a}); log('Form submitted',f.title); saveDB(); closeModal(); toast('Thank you – response recorded','ok'); render(); });
ACT.formResp = el => { const f = DB.forms.find(x=>x.id===el.dataset.id); modal({title:'Responses – '+esc(f.title),size:'wide',body:table([{h:'Who',f:r=>esc(empName(r.who))},{h:'Date',f:r=>fmt(r.t)},...f.fields.map(q=>({h:esc(q.label),f:r=>esc(r.a[q.k])}))],f.responses,{empty:'No responses yet.'}),actions:[{label:'Close',act:'closeModal'},{label:'Export CSV',cls:'pri',act:'formCsv',data:`data-id="${f.id}"`}]}); };
ACT.formCsv = el => { const f = DB.forms.find(x=>x.id===el.dataset.id); csvDownload('form_'+f.title.replace(/\W/g,'_'),['Who','Date',...f.fields.map(q=>q.label)],f.responses.map(r=>[empName(r.who),r.t,...f.fields.map(q=>r.a[q.k])])); };

/* ---------------- NOTICE BOARD ---------------- */
VIEWS.noticeboard = () => {
  const tabs = [['news','News & events'],['promo','Promotions'],['rec','Recognition'],['gal','Memories']], k = tabOf('nb','news'); DB.views ||= {};
  const post = n => { (DB.views[n.id] ||= []); if(!DB.views[n.id].includes(SESSION.uid)) DB.views[n.id].push(SESSION.uid);
    return `<div class="card"><div class="row sp wrap"><div class="row">${n.who?av(n.who,42):`<div class="kicon" style="background:#e2f4f8;color:var(--blue)">${ico(n.kind==='Event'?'cal':'flag')}</div>`}<div><b style="font-size:15px">${esc(n.title)}</b><div class="small muted">${badge(n.kind)} ${fmt(n.date)} · ${esc(n.by)}</div></div></div>${isHR()?`<span class="small muted">${DB.views[n.id].length} read · ${reactCount('news-'+n.id)} reactions</span>`:''}</div><p style="margin:12px 0">${esc(n.body)}</p><div class="row sp wrap">${reactBar('news-'+n.id)}<span class="row">${n.who===SESSION.uid&&!n.thanks?`<button class="btn sm" data-act="thank" data-id="${n.id}">Reply with thanks</button>`:''}${n.thanks?`<span class="small"><b>${esc(empName(n.who))}:</b> “${esc(n.thanks)}”</span>`:''}</span></div></div>`; };
  let body = '';
  if(k==='news') body = `<div class="grid">${DB.news.filter(n=>n.kind!=='Promotion').map(post).join('')||'<div class="empty">No news.</div>'}</div>`;
  if(k==='promo') body = `<div class="grid">${DB.news.filter(n=>n.kind==='Promotion').map(post).join('')||'<div class="empty">No promotions.</div>'}</div>`;
  if(k==='rec') body = `<div class="toolbar"><span class="grow"></span>${isMgr()?`<button class="btn pri" data-act="newRec">${ico('plus')} Nominate</button>`:''}${isHR()?`<button class="btn" data-act="recMail">${ico('mail')} Send monthly reaction summaries</button>`:''}</div><div class="grid g2">${DB.recognition.map(r=>{ const e = emp(r.who); return `<div class="card"><div class="row">${e?av(e,48):''}<div><b>${esc(e?e.name:r.who)}</b><div>${badge(r.kind+' of the Month '+r.month,'pur')}</div></div></div><p>${esc(r.why)}</p><div class="row sp">${reactBar('rec-'+r.id)}<span class="small muted">${reactCount('rec-'+r.id)} reactions this month</span></div></div>`; }).join('')}</div>`;
  if(k==='gal') body = `<div class="toolbar"><span class="grow"></span>${isHR()?`<button class="btn pri" data-act="newMem">${ico('plus')} Add memory</button>`:''}</div><div class="grid g3">${DB.gallery.map(g=>`<div class="card">${g.img?`<img src="${g.img}" alt="" style="width:100%;border-radius:10px;aspect-ratio:16/10;object-fit:cover">`:`<div style="aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#dbe5fb,#f3e8ff);display:flex;align-items:center;justify-content:center;color:var(--blue)">${ico('award')}</div>`}<b style="display:block;margin-top:10px">${esc(g.title)}</b><div class="small muted">${g.year} · ${esc(g.note)}</div></div>`).join('')}</div>`;
  saveDB();
  return pageHead('Notice Board','Company news, promotions, recognition and official memories.',`${isHR()?`<button class="btn pri" data-act="newPost">${ico('plus')} New post</button>`:''}`) + tabsHtml('nb',tabs,'news') + body;
};

 {id:'summary',name:'Employee summary',d:'Headcount by company, region and contract',run:p=>{ const l = scopeEmps(p), by = {}; l.forEach(e=>{ const k = e.company+'|'+e.region+'|'+e.contract; by[k] = (by[k]||0)+1; }); return {h:['Company','Region','Contract','Headcount'],r:Object.entries(by).map(([k,n])=>[...k.split('|'),n])}; }},
 {id:'demo',name:'Demographics',d:'Age band, length of service and region (aggregated)',run:p=>{ const l = scopeEmps(p), rows = []; [['Under 25',0,24],['25–34',25,34],['35–44',35,44],['45–54',45,54],['55+',55,200]].forEach(([n,a,b])=>rows.push(['Age',n,l.filter(e=>age(e)>=a&&age(e)<=b).length])); [['Under 1 year',0,1],['1–3 years',1,3],['3–5 years',3,5],['5–10 years',5,10],['10+ years',10,100]].forEach(([n,a,b])=>rows.push(['Service',n,l.filter(e=>svc(e)>=a&&svc(e)<b).length])); REGIONS.forEach(r=>rows.push(['Region',r,l.filter(e=>e.region===r).length])); return {h:['Dimension','Band','Employees'],r:rows}; }},
 {id:'attr',name:'Attrition',d:'Leavers, reasons and rate in the period',run:p=>{ const f = p.from||D.iso(D.add(D.today(),-365)), t = p.to||D.todayIso(); const lv = DB.exits.filter(x=>inRange(x.last,f,t) && scopeEmps({...p,leavers:true}).some(e=>e.id===x.emp)); const hc = scopeEmps({...p,leavers:true}).length; return {h:['Employee','Type','Reason','Last day','Tenure (yrs)'],r:lv.map(x=>[empName(x.emp),x.type,x.reason,x.last,svc(emp(x.emp)).toFixed(1)]).concat([['Attrition rate','','',`${hc?(lv.length/hc*100).toFixed(2):'0.00'}%`,'']])}; }},
 {id:'att',name:'Attendance summary',d:'Working days by absence type in a custom date range',run:p=>{ const f = p.from||D.iso(D.add(D.today(),-30)), t = p.to||D.todayIso(); const types = Object.keys(LT).filter(k=>k!=='HALF'); return {h:['Employee','Department',...types.map(k=>LT[k].code),'Total'],r:scopeEmps(p).map(e=>{ const c = types.map(k=>DB.leave.filter(l=>l.emp===e.id&&l.type===k&&l.status==='approved').reduce((s,l)=>s+recDays({...l,start:l.start<f?f:l.start,end:l.end>t?t:l.end},e.region)*(l.end<f||l.start>t?0:1),0)); return [e.name,e.depts.join(' / '),...c.map(num1),num1(c.reduce((a,b)=>a+b,0))]; })}; }},
 {id:'brad',name:'Bradford Factor',d:'Rolling 52 weeks: spells² × days',run:p=>({h:['Employee','Department','Spells','Days','Score','Stage'],r:scopeEmps(p).map(e=>({e,b:bradford(e.id)})).filter(x=>x.b.spells).sort((a,b)=>b.b.score-a.b.score).map(x=>[x.e.name,x.e.depts.join(' / '),x.b.spells,num1(x.b.days),x.b.score,bradLevel(x.b.score)[0]])})},
 {id:'absd',name:'Absence – detailed',d:'Every absence record in the range',run:p=>{ const f = p.from||D.iso(D.add(D.today(),-90)), t = p.to||D.todayIso(), ids = new Set(scopeEmps({...p,leavers:true}).map(e=>e.id)); return {h:['Employee','Type','From','To','Days','Status','Notes'],r:DB.leave.filter(l=>ids.has(l.emp)&&l.type!=='HOL'&&inRange(l.start,f,t)).map(l=>[empName(l.emp),LT[l.type].name,l.start,l.end,num1(recDays(l,emp(l.emp).region)),l.status,LT[l.type].sick&&!isHR()?'(restricted)':l.note])}; }},
 {id:'hol',name:'Holidays – approved, unapproved & remaining',d:'Per employee with percentage used',run:p=>{ return {h:['Employee','Entitlement','Approved','Unapproved (pending)','Remaining','% used'],r:scopeEmps(p).map(e=>{ const b = balance(e,curLY(e)), ap = b.taken+b.upcoming; return [e.name,num1(b.total),num1(ap),num1(b.pending),num1(b.remaining),(b.total?ap/b.total*100:0).toFixed(2)+'%']; })}; }},
 {id:'accr',name:'Accrual',d:'Accrued to date vs taken',run:p=>{ return {h:['Employee','Region','Start','Entitlement','Accrued to date','Taken','Booked','Balance now'],r:scopeEmps(p).map(e=>{ const b = balance(e,curLY(e)); return [e.name,e.region,e.start,num1(b.total),num1(b.acc),num1(b.taken),num1(b.upcoming),num1(b.acc-b.taken)]; })}; }},
 {id:'month',name:'Monthly employee report',d:'Starters, leavers and absence for a month',run:p=>{ const m = p.month||D.todayIso().slice(0,7), l = scopeEmps({...p,leavers:true}); return {h:['Measure','Value'],r:[['Month',m],['Starters',l.filter(e=>e.start.startsWith(m)).length],['Leavers',l.filter(e=>(e.leaveDate||'').startsWith(m)).length],['Sickness days',num1(DB.leave.filter(x=>LT[x.type].sick&&l.some(e=>e.id===x.emp)).reduce((s,x)=>{ let n=0; for(let d=D.parse(x.start);D.iso(d)<=x.end;d=D.add(d,1)){ if(D.iso(d).startsWith(m)) n+=dayValue(x,D.iso(d),emp(x.emp).region); } return s+n; },0))],['Holiday days',num1(DB.leave.filter(x=>x.type==='HOL'&&x.status==='approved'&&l.some(e=>e.id===x.emp)).reduce((s,x)=>{ let n=0; for(let d=D.parse(x.start);D.iso(d)<=x.end;d=D.add(d,1)){ if(D.iso(d).startsWith(m)) n+=dayValue(x,D.iso(d),emp(x.emp).region); } return s+n; },0))]]}; }},

 {id:'start',name:'Start & leave dates',d:'Joiners and leavers',run:p=>({h:['Employee','Department','Start','Leaving'],r:scopeEmps({...p,leavers:true}).map(e=>[e.name,e.depts.join(' / '),e.start,e.leaveDate||''])})},
 {id:'emerg',name:'Emergency contacts',d:'Restricted to HR',hr:1,run:p=>({h:['Employee','Contact','Relationship','Phone'],r:scopeEmps(p).map(e=>[e.name,e.emergency.name,e.emergency.rel,e.emergency.phone])})},
 {id:'mood',name:'Mood (anonymised)',d:'Daily mood totals – no individual data',hr:1,run:()=>{ const by = {}; DB.mood.forEach(m=>{ (by[m.date] ||= {})[m.v] = (by[m.date][m.v]||0)+1; }); return {h:['Date',...MOODS.map(m=>m[1])],r:Object.entries(by).sort().map(([d,v])=>[d,...MOODS.map(m=>v[m[1]]||0)])}; }},
 {id:'sick',name:'Sickness',d:'Spells and days by employee, last 52 weeks',run:p=>({h:['Employee','Department','Spells','Days','Fri/Mon days','Total days'],r:scopeEmps(p).map(e=>({e,b:bradford(e.id),f:fridayMonday(e.id)})).filter(x=>x.b.spells).map(x=>[x.e.name,x.e.depts.join(' / '),x.b.spells,num1(x.b.days),x.f.fm,x.f.tot])})}

 {id:'q1',title:'Health & Safety basics',qs:[

function allQuizzes(){ return QUIZZES.concat(G().extra||[]); }
VIEWS.games = () => {

   <div class="card"><h3><span class="l">${ico('help')} Quizzes</span></h3><div class="grid g2">${allQuizzes().map(q=>{ const d = g.done[u.id+'|'+q.id]; return `<div class="card flat game-card"><b>${esc(q.title)}</b><span class="small muted">${q.qs.length} questions · 2 points per correct answer, +5 for full marks</span>${d!==undefined?badge('Your score '+d+'/'+q.qs.length,'ok'):''}<div class="row"><button class="btn sm pri" data-act="playQuiz" data-id="${q.id}">${d!==undefined?'Review / retake for fun':'Play'}</button></div></div>`; }).join('')}</div></div>

function scramble(w, seed){ const a = w.split(''); let s = seed*7919+13; for(let i=a.length-1;i>0;i--){ s = (s*1103515245+12345)&0x7fffffff; const j = s%(i+1); [a[i],a[j]] = [a[j],a[i]]; } const r = a.join(''); return r===w ? a.reverse().join('') : r; }
ACT.wordCheck = el => { const g = G(), k = SESSION.uid+'|'+D.todayIso(); const v = $('#wsi').value.trim().toUpperCase(); if(!v) return; if(v!==el.dataset.w) return toast('Not quite – try again!','bad'); if(g.words[k]) return toast('Already solved today.'); g.words[k] = 1; addPts(SESSION.uid,5); log('Game','Word scramble solved'); saveDB(); toast('Correct! +5 points','ok'); render(); };

ACT.quizSubmit = el => { const q = allQuizzes().find(x=>x.id===el.dataset.id), f = $('#qf'); let sc = 0, miss = 0; q.qs.forEach((x,i)=>{ const v = f.querySelector(`input[name=q${i}]:checked`); if(!v) miss++; else if(+v.value===x[2]) sc++; }); if(miss) return toast('Please answer every question.','bad');
  const k = SESSION.uid+'|'+q.id, first_ = G().done[k]===undefined; if(first_){ G().done[k] = sc; addPts(SESSION.uid, sc*2 + (sc===q.qs.length?5:0)); log('Game','Quiz '+q.title+' '+sc+'/'+q.qs.length); } saveDB(); closeModal();
  modal({title:'Your result',body:`<h2 style="margin-bottom:10px">${sc} / ${q.qs.length}</h2>${q.qs.map((x,i)=>`<div class="small" style="margin:4px 0">${i+1}. ${esc(x[0])} <b>→ ${esc(x[1][x[2]])}</b></div>`).join('')}<p class="muted small">${first_?'Points added to the leaderboard.':'Practice attempt – points are only awarded on the first try.'}</p>`,actions:[{label:'Close',cls:'pri',act:'closeModal'}]}); render(); };
ACT.newQuiz = () => modal({title:'New quiz',size:'wide',body:`<form id="nq"><div class="field"><label>Title</label><input name="t"></div><div class="field"><label>Questions – one per line: <code>Question | Option A | Option B | Option C | correct number (1-3)</code></label><textarea name="b" style="min-height:140px"></textarea></div><div id="nqe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Create',cls:'pri',act:'saveQuiz'}]});
ACT.saveQuiz = () => { const f = $('#nq'), er = $('#nqe'); const qs = f.b.value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a.length===5 && [1,2,3].includes(+a[4]) && a.slice(0,4).every(Boolean)).map(a=>[a[0],a.slice(1,4),+a[4]-1]); if(f.t.value.trim().length<3 || !qs.length){ er.textContent='Enter a title and at least one correctly formatted question.'; er.classList.add('show'); return; } G().extra.push({id:uid('q'),title:f.t.value.trim(),qs}); saveDB(); closeModal(); render(); };
ACT.newRaffle = () => modal({title:'New raffle',body:`<form id="rf2"><div class="fgrid"><div class="field full"><label>Raffle title</label><input name="t"></div><div class="field"><label>Prize</label><input name="p"></div><div class="field"><label>Closes</label><input type="date" name="d" min="${D.todayIso()}"></div></div><div id="rfe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Create',cls:'pri',act:'saveRaffle'}]});
ACT.saveRaffle = () => { const f = $('#rf2'), er = $('#rfe'); if(f.t.value.trim().length<3 || !f.p.value.trim() || !f.d.value){ er.textContent='Title, prize and closing date are required.'; er.classList.add('show'); return; } G().raffles.unshift({id:uid('rf'),title:f.t.value.trim(),prize:f.p.value.trim(),closes:f.d.value,entrants:[],winner:null}); log('Raffle created',f.t.value); saveDB(); closeModal(); render(); };
ACT.raffleIn = el => { const r = G().raffles.find(x=>x.id===el.dataset.id); if(!r.entrants.includes(SESSION.uid)) r.entrants.push(SESSION.uid); saveDB(); toast('You are in the draw!','ok'); render(); };
ACT.raffleDraw = el => confirmBox('Draw the winner now? This cannot be undone.', () => { const r = G().raffles.find(x=>x.id===el.dataset.id); r.winner = r.entrants[rnd(r.entrants.length)]; r.drawn = nowStamp(); notify(r.winner, `You won the raffle “${r.title}”! Prize: ${r.prize}.`, 'games'); log('Raffle drawn', `${r.title}: ${empName(r.winner)} from ${r.entrants.length} entries`); saveDB(); render(); }, 'Draw');
const MEMS = ['🍎','🚚','📦','⭐','🏆','🌱'];
ACT.memStart = () => { const cards = MEMS.concat(MEMS).map((s,i)=>({s,i,sort:rnd(1000)})).sort((a,b)=>a.sort-b.sort).map((c,k)=>({id:k,s:c.s,up:false,done:false})); window.__m = {cards,moves:0,sel:[],lock:false}; modal({title:'Memory match',body:`<div id="memb"></div>`,actions:[{label:'Close',act:'closeModal'}]}); memDraw(); };
function memDraw(){ const m = window.__m; $('#memb').innerHTML = `<p class="muted small">Moves: <b>${m.moves}</b></p><div class="memg">${m.cards.map(c=>`<button class="memc ${c.up?'up':''} ${c.done?'done':''}" data-act="memFlip" data-i="${c.id}" aria-label="card">${c.up||c.done?c.s:'?'}</button>`).join('')}</div>`; }
ACT.memFlip = el => { const m = window.__m, c = m.cards[+el.dataset.i]; if(m.lock||c.up||c.done) return; c.up = true; m.sel.push(c); memDraw();
  if(m.sel.length===2){ m.moves++; m.lock = true; const [a,b] = m.sel; setTimeout(()=>{ if(a.s===b.s){ a.done = b.done = true; } a.up = b.up = false; m.sel = []; m.lock = false; if(!$('#memb')) return; memDraw();
    if(m.cards.every(x=>x.done)){ const k = SESSION.uid+'|'+D.todayIso(), g = G(); let pts = 0; if(!g.memory[k]){ g.memory[k] = 1; pts = m.moves<=14?10:5; addPts(SESSION.uid,pts); log('Game','Memory match in '+m.moves+' moves'); saveDB(); } $('#memb').insertAdjacentHTML('beforeend',`<div class="banner" style="margin-top:12px;background:var(--ok-l);border-color:#9bd9ab;color:#14532d">Finished in ${m.moves} moves. ${pts?`+${pts} points!`:'Points are awarded once a day.'}</div>`); render(); } }, 700); } };

/* ================= EMAIL & AUTOMATION (HR-031/032/033/039/041/043) ================= */
const AUTOCFG = () => ens('autoCfg', {bday:1,colleague:1,anniv:1,videos:1,rtw:1});
function sendMail(to, subject, body, kind, extra){ const key = [kind,to,subject].join('|')+D.todayIso(); const keys = ens('autoKeys',{}); if(keys[key]) return 0; keys[key] = 1;
  ens('outbox',[]).unshift({id:uid('m'),t:nowStamp(),to,subject,body,kind,extra}); notify(to, subject, 'dashboard'); return 1; }
function runAutomation(){
  const today = D.todayIso(), cfg = AUTOCFG(); let n = 0; const md = today.slice(5);
  DB.emps.filter(e=>e.status==='active').forEach(e => {
    if(e.dob.slice(5)===md && cfg.bday) n += sendMail(e.id, `Happy birthday, ${first(e.name)}!`, `Dear ${first(e.name)},\n\nWishing you a very happy birthday from everyone at PFG Group.\n\nGlobal HR Services`, 'HR birthday email');
    if(e.dob.slice(5)===md && cfg.colleague) DB.emps.filter(c=>c.status==='active' && c.id!==e.id && c.depts.some(d=>e.depts.includes(d))).forEach(c => { n += sendMail(c.id, `It’s ${e.name}’s birthday today`, `Hi ${first(c.name)},\n\nIt’s ${e.name}’s birthday today. Click the button below to send your wishes through the HR portal.`, 'Colleague birthday', {wish:e.id,k:'bday',date:today}); });
    const yrs = +today.slice(0,4) - +e.start.slice(0,4);
    if(e.start.slice(5)===md && yrs>0 && cfg.anniv) { n += sendMail(e.id, `Happy work anniversary – ${yrs} year${yrs>1?'s':''} at PFG!`, `Dear ${first(e.name)},\n\nThank you for ${yrs} year${yrs>1?'s':''} with PFG Group.\n\nGlobal HR Services`, 'Work anniversary'); }
  });
  if(new Date().getDay()===1 && cfg.videos) DB.emps.filter(e=>e.status==='active').forEach(e => { const un = DB.videos.filter(v=>!v.seen[e.id]); if(un.length) n += sendMail(e.id, 'Weekly reminder: training videos to watch', `Hi ${first(e.name)},\n\nPlease watch: ${un.map(v=>v.title).join(', ')}.\n\nOpen the Video Portal in the HR portal.`, 'Training reminder'); });
  if(cfg.rtw) DB.rtw.filter(r=>r.status==='Due' && r.due<=today).forEach(r => managersOf(emp(r.emp)).forEach(m => { n += sendMail(m, `Return-to-work form due: ${empName(r.emp)}`, `The return-to-work form for ${empName(r.emp)} was due on ${fmt(r.due)}. Please complete it in the HR portal.`, 'RTW reminder'); }));
  DB.lastAuto = today; saveDB(); return n;
}

/* ================= ATTENDANCE CROSS-CHECK (BRS 5.6, HR-011) ================= */
const SH_T = {E:['06:00','14:00'],D:['09:00','17:30'],L:['14:00','22:00']};
function shiftFor(e, d){ const lv = DB.leave.find(l=>l.emp===e.id&&l.status==='approved'&&d>=l.start&&d<=l.end&&!['WFH','HALF'].includes(l.type)); if(lv) return 'LV'; if(phName(d,e.region)) return 'PH'; const wk = D.iso(mondayOf(D.parse(d)));
  for(const dep of e.depts){ const R = DB.rota[dep+'|'+wk]; const c = R && R[e.id] && R[e.id][d]; if(c) return c; } return isRest(e,d)?'OFF':'D'; }
function genPunches(){ const P = ens('punches',[]); const today = D.today(); let n = 0;
  DB.emps.filter(e=>e.status==='active').forEach((e,ei) => { for(let k=7;k>=1;k--){ const d = D.iso(D.add(today,-k)); if(P.some(p=>p.emp===e.id&&p.date===d)) continue; const h = (ei*31+k*17+ +e.id.slice(1)*7)%100, sh = shiftFor(e,d);
    if(['LV','PH','OFF','N'].includes(sh)){ if(h%41===0 && sh!=='N'){ P.push({emp:e.id,date:d,in:'09:00',out:'13:00'}); n++; } continue; }
    const [s,en] = SH_T[sh]; if(h%23===0) continue; const p = {emp:e.id,date:d,in:fmtHM(hm(s)+(h%7)-3),out:fmtHM(hm(en)+(h%9)-2)};
    if(h%19===0) p.in = fmtHM(hm(s)+25+h%15); if(h%29===0) p.out = ''; if(h%37===0) p.out = fmtHM(hm(en)+240); P.push(p); n++; } }); return n; }
const GRACE = 10, MAXH = 10;
function crossCheck(){ const A = ens('anoms',[]); let added = 0; const today = D.todayIso();
  DB.emps.filter(e=>e.status==='active').forEach(e => { for(let k=7;k>=1;k--){ const d = D.iso(D.add(D.today(),-k)), sh = shiftFor(e,d), p = (DB.punches||[]).find(x=>x.emp===e.id&&x.date===d), found = [];
    if(['E','D','L'].includes(sh)){ const [s,en] = SH_T[sh];
      if(!p) found.push(['No-show','No clocking against a rostered '+sh+' shift']);
      else if(!p.in || !p.out) found.push(['Missing punch', p.in?'No clock-out':'No clock-in']);

function forecastGrid(){ const weeks = Array.from({length:8},(_,i)=>D.iso(D.add(mondayOf(D.today()),i*7))); const pool = isHR()?DB.depts:[...new Set(visibleEmps().flatMap(e=>e.depts))];

const lyStart = e => ((DB.settings.leaveYearStart||{})[e.region]) || 1;
const leaveYearOf = (e, iso) => { const sm = lyStart(e), y = +iso.slice(0,4), m = +iso.slice(5,7); return sm===1 ? y : (m>=sm ? y : y-1); };
const curLY = e => leaveYearOf(e, D.todayIso());
function lyRange(e, ly){ const sm = lyStart(e), p = n => String(n).padStart(2,'0'); const from = `${ly}-${p(sm)}-01`; const next = sm===1 ? `${ly+1}-01-01` : `${ly+1}-${p(sm)}-01`; return [from, D.iso(D.add(D.parse(next),-1))]; }
const lyLabel = (e, ly) => lyStart(e)===1 ? String(ly) : `${ly}/${String(ly+1).slice(2)}`;
const lyText = (e, ly) => { const [a,b] = lyRange(e,ly); return `${fmt(a)} – ${fmt(b)}`; };

function entitlement(e, ly, kind='hol'){
  const [from, to] = lyRange(e, ly), S = DB.settings;
  const base = kind==='hol' ? ((S.quota[e.region]||0) + (e.extraDays||0)) : ((S.sickQuota||{})[e.region]||0);
  if(!base) return 0;
  const tot = D.diff(from,to)+1, pro = (a,b) => b<a ? 0 : Math.round(base*(D.diff(a,b)+1)/tot*2)/2;
  const mx = (...a) => a.reduce((x,y)=>x>y?x:y), end = e.leaveDate && e.leaveDate<to ? e.leaveDate : to;
  if(e.probation && e.region==='PK'){            // PK: 3 holidays during probation, full pro-rata after confirmation
    const lyS = leaveYearOf(e, e.start); if(ly < lyS) return 0;
    const grant = (S.probationGrant||{}).PK ?? 3; let total = 0;
    if(kind==='hol' && ly===lyS) total += grant;
    if(e.probation.done && e.probation.confirmed) total += pro(mx(e.probation.confirmed, from, e.start), end);
    return total;
  }
  return pro(mx(e.start, from), end);
}
function accrued(e, ly, asOf){ const ent = entitlement(e,ly), [a,b] = lyRange(e,ly), y0 = D.parse(a), y1 = D.parse(b); const f = asOf<y0 ? 0 : asOf>y1 ? 1 : ((asOf-y0)/864e5+1)/((y1-y0)/864e5+1); return Math.round(ent*f*2)/2; }
function balance(e, ly){
  const carry = (e.carry||{})[ly]||0, ent = entitlement(e,ly), today = D.todayIso(); let taken=0, upcoming=0, pending=0, sickTaken=0;
  DB.leave.filter(l => l.emp===e.id && l.status!=='rejected' && l.status!=='cancelled' && (l.type==='HOL' || LT[l.type].sick)).forEach(l => {
    for(let d=D.parse(l.start); D.iso(d)<=l.end; d=D.add(d,1)){ const i = D.iso(d); if(leaveYearOf(e,i)!==ly) continue; const v = dayValue(l,i,e.region); if(!v) continue;
      if(l.type!=='HOL'){ if(l.status==='approved') sickTaken += v; continue; }
      if(l.status==='pending') pending += v; else if(i<=today) taken += v; else upcoming += v; } });
  const total = ent+carry, sickEnt = entitlement(e,ly,'sick');
  return {ent, carry, total, taken, upcoming, pending, remaining: total-taken-upcoming, free: total-taken-upcoming-pending, acc: accrued(e,ly,D.today())+carry, sickEnt, sickTaken, sickRem: sickEnt-sickTaken};
}
function dayValue(rec, iso, region){
  if(iso<rec.start||iso>rec.end) return 0; const e = emp(rec.emp); if(isRest(e, iso)) return 0;

  `<div class="card" style="margin-bottom:16px"><div class="row sp wrap"><div><b>${g.n} of ${g.total} items complete</b><div class="small muted">${e.region==='UK'?'UK new starter pack':'PK new starter pack (assumption: UK-only items removed)'} · Status: ${statusBadge(p.status==='Not started'?'Pending':p.status)}</div></div>${locked?badge(p.status==='Approved'?'Approved by HR':'Submitted – with HR','ok'):`<button class="btn pri" data-act="spSubmit" ${g.n===g.total?'':'disabled'}>${ico('check')} Submit to HR</button>`}</div><div class="prog ${g.pct===100?'g':''}" style="margin-top:12px"><i style="width:${g.pct}%"></i></div>${p.note?`<div class="banner" style="margin:12px 0 0">${ico('warn')}<span><b>HR feedback:</b> ${esc(p.note)}</span></div>`:''}</div>
  <div class="grid g2">${tasks.map(([k,l])=>{ const done = taskDone(p,k), started = p.data[k] || p.docs.some(x=>DOC_SLOTS[k]&&DOC_SLOTS[k].some(s=>s[0]===x.slot)); return `<div class="card"><div class="row sp"><b>${esc(l)}</b>${done?badge('Complete','ok'):started?badge('In progress','warn'):badge('To do')}</div><p class="small muted" style="margin:6px 0 12px">${esc(taskBlurb[k])}</p><button class="btn sm ${done?'':'pri'}" data-act="spOpen" data-k="${k}">${locked?'View':done?'Review':'Open'}</button></div>`; }).join('')}</div>
  <p class="small muted" style="margin-top:14px">Questions? Email hr@pentagonfoodgroup.co.uk. Your information is processed in line with data-protection law; special-category data (health, equality) is visible to HR only.</p>`; };
ACT.spOpen = el => { const e = me(), p = SP(e.id), k = el.dataset.k, label = packTasks(e.region).find(t=>t[0]===k)[1], ro = p.status==='Submitted'||p.status==='Approved', d = p.data[k]||{};
  let body;
  if(DOC_SLOTS[k]) body = `<p class="muted small">${esc(taskBlurb[k])} Files up to 300 KB (PDF, JPG or PNG) in this prototype.</p>${k==='rtwdocs'?`<div class="field"><label>Share code (if you have one)</label><input id="spsc" value="${esc(d.sharecode||'')}" ${ro?'disabled':''}></div>`:''}${DOC_SLOTS[k].map(([sl,lb])=>{ const doc = p.docs.find(x=>x.slot===sl); return `<div class="card flat" style="margin-bottom:10px"><b class="small">${esc(lb)}</b>${doc?`<div class="row sp" style="margin-top:6px"><span class="small">${esc(doc.name)} · ${Math.round(doc.size/1024)} KB</span>${ro?'':`<button class="btn sm" data-act="spDocDel" data-slot="${sl}" data-k="${k}">Remove</button>`}</div>`:ro?'<div class="muted small">Not uploaded</div>':`<input type="file" accept=".pdf,.jpg,.jpeg,.png" data-chg="spDoc" data-slot="${sl}" data-k="${k}" style="margin-top:6px">`}</div>`; }).join('')}<form id="spf" onsubmit="return false">${sigHtml(k,p,ro)}</form>`;
  else body = `<form id="spf" onsubmit="return false">${k==='medical'?medHtml(d,ro):specHtml(SPEC[k].map(f=>f), k==='newstarter'?{job:e.title,startdate:fmt(e.start),email:e.email,first:e.name.split(' ')[0],surname:e.name.split(' ').slice(1).join(' '),...d}:d, ro, e.region)}${sigHtml(k,p,ro)}<div id="spe" class="err"></div></form>`;
  modal({title:esc(label),size:'wide',body,actions:ro?[{label:'Close',act:'closeModal'}]:[{label:'Cancel',act:'closeModal'},{label:'Save & mark complete',cls:'pri',act:'spSave',data:`data-k="${k}"`}]});
  $$('canvas.sigc').forEach(c=>{ c.getContext('2d').strokeStyle = '#06566a'; }); };
CHG.spDoc = el => { const f = el.files[0]; if(!f) return; if(f.size>300*1024){ toast('File is larger than 300 KB.','bad'); el.value=''; return; } const rd = new FileReader(); rd.onload = () => { const p = SP(SESSION.uid); p.docs = p.docs.filter(x=>x.slot!==el.dataset.slot); p.docs.push({slot:el.dataset.slot,name:f.name,size:f.size,data:rd.result,t:nowStamp()}); log('Starter doc uploaded',f.name); saveDB(); ACT.spOpen({dataset:{k:el.dataset.k}}); }; rd.readAsDataURL(f); };
ACT.spDocDel = el => { const p = SP(SESSION.uid); p.docs = p.docs.filter(x=>x.slot!==el.dataset.slot); saveDB(); ACT.spOpen({dataset:{k:el.dataset.k}}); };
ACT.spSave = el => submitOnce(el, () => { const e = me(), p = SP(e.id), k = el.dataset.k, f = $('#spf'), er = $('#spe'); const fail = m => { if(er){ er.textContent = m; er.classList.add('show'); } else toast(m,'bad'); };
  if(DOC_SLOTS[k]){ const need = DOC_SLOTS[k].filter(s=>!(k==='rtwdocs'&&s[0]==='rtw2')); if(!need.every(s=>p.docs.some(x=>x.slot===s[0]))) return toast('Please upload the required document(s).','bad'); p.data[k] = {_done:true, sharecode:$('#spsc')?.value.trim()||''}; }
  else if(k==='medical'){ const {v,miss} = collectMed(f); if(miss) return fail(`Please answer every question (${miss} still need an answer or details).`); p.data[k] = {...v,_done:true}; }
  else { const spec = SPEC[k], v = collect(f, spec), bad = spec.filter(x=>!Array.isArray(x) && !x.o && !x.ro && !(x.uk&&e.region!=='UK') && (x.t==='check' ? !v[x.k] : !v[x.k])); if(bad.length) return fail('Please complete: '+bad.map(x=>x.l.length>40?x.l.slice(0,40)+'…':x.l).join('; ')); if(k==='newstarter' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fail('Enter a valid email address.'); if(k==='newstarter' && v.dob && !validDate(v.dob)) return fail('Enter a valid date of birth.'); p.data[k] = {...v,_done:true}; }
  if(!readSig(f||document.createElement('form'), p, k)){ if(DOC_SLOTS[k]) return; delete p.data[k]._done; return; }
  if(p.status==='Not started') p.status = 'In progress'; p.log.push({t:nowStamp(),w:'Completed: '+packTasks(e.region).find(t=>t[0]===k)[1]}); log('Starter pack item completed',k); saveDB(); closeModal(); toast('Saved','ok'); render(); });
ACT.spSubmit = () => { const e = me(), p = SP(e.id); if(packProgress(e,p).n<packProgress(e,p).total) return; p.status = 'Submitted'; p.submitted = nowStamp(); p.note = ''; p.log.push({t:nowStamp(),w:'Submitted to HR'}); notify(DB.emps.filter(x=>x.role==='hr'||x.role==='admin').map(x=>x.id), `${e.name} submitted their New Starter Pack for checking.`, 'onboarding'); log('Starter pack submitted',''); saveDB(); toast('Submitted to HR – thank you!','ok'); render(); };

ACT.spCreate = el => { const e = emp(el.dataset.id); newPack(e); notify(e.id,'Please complete your New Starter Pack.','starter'); log('Starter pack created','',e.id); saveDB(); toast('Starter pack created for '+e.name+' – they will see “My Starter Pack” when they sign in','ok'); render(); };
ACT.spReview = el => { const e = emp(el.dataset.id), p = SP(e.id), o = p.office||{}; const rd = (k) => `<dt>${k}</dt>`;
  const sec = ([k,l]) => { const d = p.data[k]||{}; let inner; if(DOC_SLOTS[k]) inner = DOC_SLOTS[k].map(([sl,lb])=>{ const x = p.docs.find(y=>y.slot===sl); return `<div class="small">${esc(lb)}: ${x?`<a href="#" data-act="spDl" data-id="${e.id}" data-slot="${sl}">${esc(x.name)}</a>`:'<span class="muted">not uploaded</span>'}</div>`; }).join('')+(d.sharecode?`<div class="small">Share code: ${esc(d.sharecode)}</div>`:'');
    else if(k==='medical') inner = [[MED_A,'a'],[MED_B,'b']].map(([ls,pr])=>ls.map((t,i)=>d[pr+i]&&d[pr+i].y==='Yes'?`<div class="small"><b>Yes</b> – ${esc(t)} <i>${esc(d[pr+i].d)}</i></div>`:'').join('')).join('')||'<div class="small muted">All answers “No”.</div>';
    else inner = `<dl class="dl">${SPEC[k].filter(f=>!Array.isArray(f)).map(f=>`<dt>${esc(f.l.length>46?f.l.slice(0,46)+'…':f.l)}</dt><dd>${f.t==='check'?(d[f.k]?'Yes':'No'):esc(d[f.k]||'—')}</dd>`).join('')}</dl>`;
    const s = p.signs[k]; return `<div class="card flat" style="margin-bottom:10px"><div class="row sp"><b>${esc(l)}</b>${taskDone(p,k)?badge('Complete','ok'):badge('Incomplete','warn')}</div><div style="margin-top:8px">${inner}</div>${s?`<div class="small muted" style="margin-top:6px">Signed by ${esc(s.name)} · ${fmtDT(s.t)}</div>`:''}</div>`; };
  const of = (k,l,t='text') => `<div class="field"><label>${l}</label><input type="${t}" name="${k}" value="${esc(o[k]||'')}"></div>`;
  modal({title:'Starter pack – '+esc(e.name),size:'xl',body:`<div class="banner info">${ico('lock')}<span>Contains special-category and financial data. Access is logged.</span></div>${packTasks(e.region).map(sec).join('')}
  <h4 style="margin:16px 0 8px">Office use only</h4><form id="of"><div class="fgrid">${of('lma','Line manager authorisation – name')}${of('lmd','Line manager authorisation – date','date')}${of('dira','Director authorisation – name')}${of('dird','Director authorisation – date','date')}${of('tsby','Entered on TeamSeer by')}${of('accd','Passed to accounts – date','date')}${of('sal','Annual wage / salary (£ / PKR)')}${of('hrs','Actual hours to be worked')}${of('days','Days to be worked')}${of('car','Company car category')}${of('lic','Driving licence checked')}${of('eno','Employee number')}<div class="field"><label>Employee status</label><select name="st"><option ${o.st==='Permanent'?'selected':''}>Permanent</option><option ${o.st==='Temporary'?'selected':''}>Temporary</option></select></div>${of('payby','Received in Payroll by')}${of('payd','Date received','date')}</div></form>
  <div class="field"><label>Message to the employee (if returning for corrections)</label><textarea id="spn">${esc(p.note||'')}</textarea></div>`,
  actions:[{label:'Close',act:'closeModal'},{label:'Save office use',act:'spOffice',data:`data-id="${e.id}"`},{label:'Return for changes',act:'spReturn',data:`data-id="${e.id}"`},{label:'Approve pack',cls:'ok',act:'spApprove',data:`data-id="${e.id}"`}]}); };
ACT.spDl = (el,ev) => { const d = SP(el.dataset.id).docs.find(x=>x.slot===el.dataset.slot); const a = document.createElement('a'); a.href = d.data; a.download = d.name; document.body.appendChild(a); a.click(); a.remove(); log('Starter doc downloaded',d.name,el.dataset.id); };
ACT.spOffice = el => { const p = SP(el.dataset.id), f = $('#of'); p.office = Object.fromEntries([...new FormData(f)]); log('Starter pack office use updated','',el.dataset.id); saveDB(); toast('Saved','ok'); };
ACT.spReturn = el => { const p = SP(el.dataset.id), n = $('#spn').value.trim(); if(n.length<5) return toast('Add a message explaining what to correct.','bad'); p.status = 'In progress'; p.note = n; p.log.push({t:nowStamp(),w:'Returned for changes by '+me().name}); notify(el.dataset.id, 'HR has asked for changes to your New Starter Pack.', 'starter'); log('Starter pack returned','',el.dataset.id); saveDB(); closeModal(); render(); };
ACT.spApprove = el => { const p = SP(el.dataset.id), e = emp(el.dataset.id); if(packProgress(e,p).n<packProgress(e,p).total) return toast('The pack is not complete yet.','bad'); p.status = 'Approved'; p.note = ''; p.office = Object.fromEntries([...new FormData($('#of'))]); p.log.push({t:nowStamp(),w:'Approved by '+me().name});
  e.phone = p.data.newstarter?.mobile || e.phone; if(p.data.newstarter) e.emergency = {name:p.data.newstarter.ec1n,rel:p.data.newstarter.ec1r,phone:p.data.newstarter.ec1t}; e.history.unshift({t:nowStamp(),by:me().name,what:'Starter pack approved'});
  const ob = DB.onboarding.find(o=>o.emp===e.id); if(ob) ob.tasks.forEach(t=>{ if(/Right-to-Work|Policies/.test(t.t)) t.d = 1; }); notify(e.id,'Your New Starter Pack was approved. Thank you!','dashboard'); log('Starter pack approved','',e.id); saveDB(); closeModal(); toast('Pack approved','ok'); render(); };

/* ================= PROBATION REVIEW WORKFLOW (P1 / P2 / P3) ================= */
const R3 = ['Improvement required','Satisfactory','Good'], R5 = ['Below Average','Average','Satisfactory','Good','Excellent'], H3 = ['Excellent','Satisfactory','Needs Improvement'], REC = ['Approved','Extended','Not Approved'], YN = ['Yes','No'];
const P3E = [['qty','Quantity – meets deadlines'],['know','Knowledge – able to perform within job specifications'],['team','Teamwork – able to work with others'],['comm','Communication skills – presents ideas and information to others'],['qual','Quality – delivers as per requirement'],['meth','Methodically – knows how to do all work within set objectives'],['effv','Effectively – work is valuable'],['prec','Precisely – work is presentable'],['judg','Judgement – makes decisions based on sound reasoning'],['dep','Job dependability – reliable in carrying out instructions'],['att','Attitude – accepts challenges and follows instructions'],['relm','Relation with manager – responds to the manager’s directions'],['env','Adapting to company environment – fits the culture of the company']];
const PSPEC = {
 30:{title:'30 – Days Probationary Period Review Form',
  m:[{k:'att',l:'Attendance, Holidays & Timekeeping',t:'area'},{k:'conduct',l:'Conduct & Attitude',t:'area'},{k:'quality',l:'Quality of work & Productivity',t:'area'},{k:'disc',l:'Disciplinary Action Taken',t:'area',o:1},{k:'lm',l:'Line Manager additional comments',t:'area',o:1}],
  h:[{k:'hc',l:'HR Comments',t:'area',o:1}], e:[{k:'ec',l:'Employee Comments',t:'area',o:1}]},
 60:{title:'60 – Days Probationary Period Review Form',
  m:[{k:'quality',l:'Quality and accuracy of work',t:'r3'},{k:'eff',l:'Efficiency and productivity',t:'r3'},{k:'rel',l:'Work relationships (teamwork and interpersonal communication skills)',t:'r3'},{k:'comp',l:'Competency in the role',t:'r3'},{k:'obj',l:'Have the objectives identified for this period of the probation been met?',t:'yn'},{k:'train',l:'Have the training / development needs identified for this period been addressed?',t:'yn'},{k:'done',l:'Has the employee successfully completed the probationary period (60 Days)?',t:'yn'},{k:'disc',l:'Disciplinary action taken?',t:'yn'},{k:'lm',l:'Line Manager Comments (new targets or additional remarks)',t:'area',o:1}],
  h:[{k:'att',l:'Attendance (Holidays) – filled by AM / HR',t:'r3'},{k:'tk',l:'Time Keeping & Breaks – filled by AM / HR',t:'r3'},{k:'hc',l:'HR Comments',t:'area',o:1}],
  e:[{k:'culture',l:'Are you feeling comfortable in the Company’s culture?',t:'yn'},{k:'training',l:'Are you receiving training related to your job description daily?',t:'yn'},{k:'prog',l:'Has your manager discussed your progress to date?',t:'yn'},{k:'rem',l:'Additional remarks',t:'area',o:1}]},
 90:{title:'Performance Evaluation for Probation Period (90 Days)',
  m:[{k:'objs',l:'List of objectives assigned to the probationer',t:'area'},{k:'ach',l:'Achievements related to the assigned objectives (supporting details must be attached)',t:'area'},{k:'overall',l:'Overall performance rating',t:'r5'},...P3E.map(([k,l])=>({k:'p_'+k,l,t:'r5'})),{k:'couns',l:'Was counselling to the employee required?',t:'yn'},{k:'conf',l:'Has the employee successfully completed the probationary period and should be confirmed?',t:'yn'},{k:'ext',l:'Should the probationary period be extended?',t:'yn'},{k:'extwhy',l:'If extended: reason, concerns, and how they will be addressed during the extension',t:'area',o:1},{k:'other',l:'Other positions or areas this person should be considered for; unusual skills or abilities',t:'area',o:1},{k:'obs',l:'Any other observations?',t:'area',o:1},{k:'rec',l:'Recommendation of the Supervisor / Head of Department',t:'rec'}],
  h:[{k:'att',l:'Attendance / punctuality',t:'h3'},{k:'attc',l:'Comments',o:1},{k:'abs',l:'Absenteeism',t:'h3'},{k:'absc',l:'Comments',o:1},{k:'brk',l:'Break management',t:'h3'},{k:'brkc',l:'Comments',o:1},{k:'final',l:'HR’s final remarks',t:'area'},{k:'rec',l:'Recommendation by HR',t:'rec'}],
  e:[{k:'rem',l:'Employee remarks',t:'area',o:1}]}
};
const SEC_NAME = {m:'Line manager section',h:'HR section',e:'Employee section'};
const pvOf = id => (DB.probReviews||[]).find(r=>r.id===id);
const pvAccess = rv => { const e = emp(rv.emp), u = me(); return {m: managersOf(e).includes(u.id) || isAdmin(), h: isHR(), e: e.id===u.id, any: isHR() || managersOf(e).includes(u.id) || e.id===u.id}; };
const pvTurn = rv => ({'Awaiting manager':'m','Awaiting HR':'h','Awaiting employee':'e'})[rv.status];
const pvLabel = rv => `${rv.stage}-day${rv.round?` (extension ${rv.round})`:''}`;
function pvEmailBody(rv, to, what){ const e = emp(rv.emp); return `Hi ${first(empName(to))},\n\n${what}\n\nEmployee: ${e.name} (${e.title})\nReview: ${pvLabel(rv)} probation review (due ${fmt(rv.due)})\n\nPlease sign in to the HR portal and open Probation ▸ ${e.name}. The form follows our standard probation template.\n\nGlobal HR Team`; }
function pvMail(rv, to, subject, what){ return sendMail(to, subject, pvEmailBody(rv,to,what), 'Probation review', {pv:rv.id}); }
function attSnap(e, from, to){ let hol=0, sickD=0, sp=0, un=0, late=0; DB.leave.filter(l=>l.emp===e.id && l.status==='approved' && l.end>=from && l.start<=to).forEach(l=>{ const d = recDays({...l,start:l.start<from?from:l.start,end:l.end>to?to:l.end},e.region); if(l.type==='HOL') hol+=d; else if(LT[l.type].sick){ sickD+=d; sp++; } else if(l.type==='UNAUTH') un+=d; else if(l.type==='LATE') late++; });
  const an = (DB.anoms||[]).filter(a=>a.emp===e.id && a.date>=from && a.date<=to); return {hol,sickD,sp,un,late,an:an.length,anTypes:[...new Set(an.map(a=>a.type))].join(', ')}; }

VIEWS.probation = (param) => param && pvOf(param) ? pvForm(pvOf(param)) : pvList();
function pvList(){
  const mine = (DB.probReviews||[]).filter(r=>{ const a = pvAccess(r), t = pvTurn(r); return t && a[t] && emp(r.emp)?.status==='active'; });
  const people = DB.emps.filter(e=>e.probation && !e.probation.done && e.status==='active' && (isHR() || e.id===SESSION.uid || manageable().some(m=>m.id===e.id)));
  const done = DB.emps.filter(e=>e.probation && e.probation.done && e.probation.confirmed>=D.iso(D.add(D.today(),-90)) && (isHR()||manageable().some(m=>m.id===e.id))).slice(0,6);
  const chip = r => { const t = {Complete:['Complete','ok'],Scheduled:['Scheduled',''],'Awaiting manager':['With manager','warn'],'Awaiting HR':['With HR','warn'],'Awaiting employee':['With employee','warn'],'Awaiting decision':['Decision needed','bad']}[r.status]; const od = r.status!=='Complete' && r.due<D.todayIso(); return badge(t[0]+(od&&r.status!=='Scheduled'?' · overdue':''), od&&r.status!=='Scheduled'?'bad':t[1]); };
  const card = e => { const rs = DB.probReviews.filter(r=>r.emp===e.id).sort((a,b)=>a.due.localeCompare(b.due)), ly = curLY(e), b = balance(e,ly);
    return `<div class="card"><div class="row">${av(e,42)}<div class="grow"><b>${esc(e.name)}</b><div class="small muted">${esc(e.title)} · ${e.region} · started ${fmt(e.start)} · probation ends ${fmt(e.probation.end)}</div></div>${e.probation.done?badge('Confirmed '+fmtS(e.probation.confirmed),'ok'):badge('In probation','warn')}</div>
    ${e.region==='PK'?`<div class="banner info" style="margin:10px 0 0;padding:8px 12px">${ico('help')}<span class="small">PK leave: ${e.probation.done?`confirmed – ${num1(b.ent)} holidays and ${num1(b.sickEnt)} sick days for ${lyLabel(e,ly)}.`:`${num1(b.ent)} holidays now; the rest (pro-rata of ${DB.settings.quota.PK} holidays) and ${(DB.settings.sickQuota||{}).PK} sick days are added when probation is confirmed.`}</span></div>`:''}
    <div style="margin-top:12px">${rs.map(r=>`<div class="li"><b style="width:112px">${pvLabel(r)}</b><span class="small muted" style="width:78px">${fmtS(r.due)}</span><span class="grow">${chip(r)}${r.legacy?` <span class="small muted">${esc(r.legacy)}</span>`:''}</span>${r.status==='Scheduled'&&isHR()?`<button class="btn sm" data-act="pvStart" data-id="${r.id}">Start now</button>`:''}<button class="btn sm ${pvTurn(r)&&pvAccess(r)[pvTurn(r)]?'pri':''}" data-act="go" data-to="probation/${r.id}">${pvTurn(r)&&pvAccess(r)[pvTurn(r)]?'Complete form':'Open'}</button></div>`).join('')}</div></div>`; };

  const puz = g.map(r=>r.slice()); [...Array(16).keys()].map(i=>({i,s:rnd(1000)})).sort((a,b)=>a.s-b.s).slice(0,9).forEach(x=>puz[Math.floor(x.i/4)][x.i%4]=0); return puz; }

function genSeq(){ const t = rnd(5), a = 1+rnd(9), d = 2+rnd(8); if(t===0) return [[0,1,2,3,4].map(i=>a+d*i), a+d*5]; if(t===1){ const r = 2+rnd(2); return [[0,1,2,3,4].map(i=>a*r**i), a*r**5]; } if(t===2){ const n = 1+rnd(5); return [[0,1,2,3,4].map(i=>(n+i)**2), (n+5)**2]; } if(t===3){ const b = 1+rnd(5), s = [a,b]; for(let i=2;i<6;i++) s.push(s[i-1]+s[i-2]); return [s.slice(0,5), s[5]]; } const x = 1+rnd(5), y = 2+rnd(6), s = [a]; for(let i=1;i<6;i++) s.push(s[i-1]+(i%2?x:y)); return [s.slice(0,5), s[5]]; }
function seqStart(){ window.__sq = Array.from({length:5},genSeq); modal({title:'Number sequences',body:`<form id="sqf">${window.__sq.map((q,i)=>`<div class="field"><label>${i+1}. ${q[0].join(', ')}, <b>?</b></label><input type="number" name="q${i}" style="width:140px"></div>`).join('')}</form><div id="sqr"></div>`,actions:[{label:'Close',act:'closeModal'},{label:'Submit',cls:'pri',act:'seqCheck'}]}); }
ACT.seqCheck = () => { const f = $('#sqf'); let sc = 0; window.__sq.forEach((q,i)=>{ if(+f['q'+i].value===q[1] && f['q'+i].value!=='') sc++; }); const got = brPts('seq', sc*2); $('#sqr').innerHTML = `<div class="banner info">Score ${sc}/5. ${got?`+${got} points.`:'Points already earned today (or none scored).'} Answers: ${window.__sq.map(q=>q[1]).join(', ')}</div>`; if(got) render(); };
/* riddles */
const RIDDLES = [['What has keys but cannot open locks?',['A piano','A map','A clock'],0],['What gets wetter the more it dries?',['A sponge','A towel','Rain'],1],['The more of me you take, the more you leave behind. What am I?',['Footsteps','Time','Money'],0],['What has hands but cannot clap?',['A statue','A glove','A clock'],2],['What can travel around the world while staying in a corner?',['A stamp','A spider','A compass'],0],['I speak without a mouth and hear without ears. What am I?',['A shadow','An echo','A radio'],1],['What has to be broken before you can use it?',['A promise','A code','An egg'],2],['What goes up but never comes down?',['Your age','A kite','Smoke'],0],['A farmer has 17 sheep. All but 9 run away. How many are left?',['8','9','17'],1],['If you share me, you no longer have me. What am I?',['A secret','A cake','A coin'],0],['What has a head and a tail but no body?',['A snake','A coin','A comet'],1],['How many months have 28 days?',['One','Two','All twelve'],2],['What is full of holes but still holds water?',['A bucket','A sponge','A net'],1],['What comes once in a minute, twice in a moment, but never in a thousand years?',['The letter M','The letter T','A second'],0]];
function riddleStart(){ const off = rnd(RIDDLES.length); window.__rd = Array.from({length:5},(_,i)=>RIDDLES[(off+i*3)%RIDDLES.length]); modal({title:'Brain teasers',size:'wide',body:`<form id="rdf">${window.__rd.map((q,i)=>`<div class="field"><label>${i+1}. ${esc(q[0])}</label>${q[1].map((o,k)=>`<label class="row" style="font-weight:500;margin:3px 0;gap:8px"><input type="radio" name="r${i}" value="${k}" style="width:auto"> ${esc(o)}</label>`).join('')}</div>`).join('')}</form><div id="rdr"></div>`,actions:[{label:'Close',act:'closeModal'},{label:'Submit',cls:'pri',act:'riddleCheck'}]}); }
ACT.riddleCheck = () => { const f = $('#rdf'); let sc = 0; window.__rd.forEach((q,i)=>{ const v = f.querySelector(`input[name=r${i}]:checked`); if(v && +v.value===q[2]) sc++; }); const got = brPts('riddle', sc*2); $('#rdr').innerHTML = `<div class="banner info">Score ${sc}/5. ${got?`+${got} points.`:'No new points today.'}<br>${window.__rd.map((q,i)=>`${i+1}. ${esc(q[1][q[2]])}`).join(' · ')}</div>`; if(got) render(); };
/* simon */
const PADS = ['#068aa2','#8eb53e','#f59e0b','#ec4899'];
function simonStart(){ window.__sm = {seq:[],pos:0,busy:true,level:0}; modal({title:'Sequence memory',body:`<p class="muted small" id="smm">Watch the lights, then repeat the pattern.</p><div style="display:grid;grid-template-columns:repeat(2,110px);gap:10px;justify-content:center;margin:12px 0">${PADS.map((c,i)=>`<button class="smp" data-act="simPad" data-i="${i}" id="sp${i}" style="height:110px;border-radius:16px;border:0;background:${c};opacity:.45;cursor:pointer" aria-label="pad ${i+1}"></button>`).join('')}</div><div class="center small" id="sml" style="text-align:center">Level 0</div>`,actions:[{label:'Close',act:'closeModal'}]}); setTimeout(simonNext,600); }
function simonNext(){ const s = window.__sm; if(!$('#smm')) return; s.seq.push(rnd(4)); s.pos = 0; s.busy = true; s.level = s.seq.length; $('#sml').textContent = 'Level '+s.level; $('#smm').textContent = 'Watch…'; s.seq.forEach((p,i)=>{ setTimeout(()=>{ const b = $('#sp'+p); if(b){ b.style.opacity = 1; setTimeout(()=>{ if(b) b.style.opacity = .45; },380); } }, 700*(i+1)); }); setTimeout(()=>{ if($('#smm')){ s.busy = false; $('#smm').textContent = 'Your turn!'; } }, 700*(s.seq.length+1)); }
ACT.simPad = el => { const s = window.__sm; if(!s || s.busy) return; const i = +el.dataset.i; el.style.opacity = 1; setTimeout(()=>{ el.style.opacity = .45; },180);
  if(i!==s.seq[s.pos]){ s.busy = true; const best = Math.min(s.seq.length-1, 10); const got = best>0 ? brPts('simon', best) : 0; $('#smm').innerHTML = `Game over at level ${s.seq.length}. ${got?`+${got} points!`:best>0?'Points already earned today.':'Try again.'}`; if(got) render(); return; }
  s.pos++; if(s.pos===s.seq.length){ s.busy = true; $('#smm').textContent = 'Well done!'; setTimeout(simonNext,900); } };
/* sliding puzzle */
function slideStart(){ let t = [1,2,3,4,5,6,7,8,0], z = 8; for(let i=0;i<90;i++){ const n = []; const r = Math.floor(z/3), c = z%3; if(r>0) n.push(z-3); if(r<2) n.push(z+3); if(c>0) n.push(z-1); if(c<2) n.push(z+1); const m = n[rnd(n.length)]; [t[z],t[m]] = [t[m],t[z]]; z = m; } if(t.every((v,i)=>v===(i+1)%9)) return slideStart(); window.__sl = {t,moves:0}; modal({title:'Sliding puzzle',body:`<p class="muted small">Order the tiles 1 to 8 with the gap in the bottom-right corner. Moves: <b id="slm">0</b></p><div id="slg"></div><div id="slr"></div>`,actions:[{label:'Close',act:'closeModal'},{label:'New puzzle',act:'brain',data:'data-g="slide"'}]}); slideDraw(); }
function slideDraw(){ const s = window.__sl; $('#slg').innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,84px);gap:6px;justify-content:center;margin:12px 0">${s.t.map((v,i)=>v?`<button data-act="slideMove" data-i="${i}" style="height:84px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;font-size:28px;font-weight:800;cursor:pointer">${v}</button>`:'<div></div>').join('')}</div>`; $('#slm').textContent = s.moves; }
ACT.slideMove = el => { const s = window.__sl, i = +el.dataset.i, z = s.t.indexOf(0), ok = (Math.abs(i-z)===3) || (Math.abs(i-z)===1 && Math.floor(i/3)===Math.floor(z/3)); if(!ok) return; [s.t[i],s.t[z]] = [s.t[z],s.t[i]]; s.moves++; slideDraw();
  if(s.t.every((v,k)=>v===(k+1)%9)){ const got = brPts('slide',10); $('#slr').innerHTML = `<div class="banner" style="background:var(--ok-l);border-color:#9bd9ab;color:#14532d">Solved in ${s.moves} moves! ${got?'+10 points.':'Points already earned today.'}</div>`; if(got) render(); } };
