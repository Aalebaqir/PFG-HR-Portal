<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PFG HR Management System</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#068aa2"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e2759'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='800' font-size='13' fill='white' text-anchor='middle'%3EPFG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#06566a;--navy2:#068aa2;--navy3:#043b4a;--blue:#068aa2;--blue-l:#e2f4f8;--green:#8eb53e;--green-d:#6f9230;
  --bg:#f2f6f4;--card:#fff;--line:#e2e7f0;--line2:#edf0f6;--text:#14213d;--muted:#66758c;
  --ok:#15803d;--ok-l:#dcfce7;--warn:#b45309;--warn-l:#fef3c7;--bad:#b91c1c;--bad-l:#fee2e2;--info:#1d4ed8;--info-l:#dbeafe;
  --radius:12px;--shadow:0 1px 2px rgba(6,60,74,.06),0 6px 20px rgba(6,60,74,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.sp{justify-content:space-between}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.login-hero{position:relative;overflow:hidden;color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(1000px 600px at 0% -10%,rgba(142,181,62,.35) 0%,transparent 55%),radial-gradient(900px 500px at 110% 110%,#0aa5c2 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy3) 100%)}
.login-hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.login-hero>*{position:relative}
.logo{display:inline-flex;align-items:center;gap:12px;line-height:1}.logo img{height:46px;width:auto;display:block}.logo .ls{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);border-left:2px solid var(--green);padding-left:12px}.logo.sm img{height:38px}.logo.lg{background:#fff;padding:14px 20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.logo.lg img{height:64px}
.logo b{font-weight:800;letter-spacing:.04em;font-size:26px}
.logo span{font-size:8.5px;letter-spacing:.32em;font-weight:600;margin-top:5px;opacity:.85}
.logo.sm b{font-size:19px}.logo.sm span{font-size:7px}
.hero-copy h1{font-size:40px;font-weight:700;letter-spacing:-.02em;max-width:520px}
.hero-copy p{opacity:.8;font-size:16px;max-width:480px;margin:16px 0 28px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;max-width:520px}
.hchip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hero-foot{font-size:12px;opacity:.65}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:410px}
.login-card h2{font-size:26px;letter-spacing:-.01em}
.login-card .sub{color:var(--muted);margin:6px 0 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#33415c}
.inp{position:relative}
.inp svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8a97ad;width:17px}
.inp input[type]{padding-left:40px}.inp input[type=password]{padding-right:40px}
.inp .eye{position:absolute;right:8px;left:auto;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:#8a97ad;padding:6px;display:flex}
.inp .eye svg.i{position:static;transform:none}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=time],input[type=url],select,textarea,input[type=search]{
  width:100%;padding:10px 12px;border:1px solid #cfd7e6;border-radius:9px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,138,162,.18)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#f5f7fc}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}.btn.pri:hover{background:var(--navy)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.block{width:100%;padding:12px}
.btn.ms{background:#fff;border-color:#cfd7e6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.demo{background:#f6f8fd;border:1px dashed #c4d0ea;border-radius:12px;padding:14px;margin-top:22px}
.demo h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{display:flex;flex-direction:column;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.demo-btn:hover{border-color:var(--blue);background:var(--blue-l)}
.demo-btn b{font-size:12px}.demo-btn span{font-size:11px;color:var(--muted)}
.err{background:var(--bad-l);color:var(--bad);padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;display:none}
.err.show{display:block}
@media(max-width:900px){.login{grid-template-columns:1fr}.login-hero{display:none}.mlogo{display:block!important}}

/* ---------- Shell ---------- */
.topbar{height:64px;background:#fff;color:var(--text);border-bottom:3px solid var(--green);display:flex;align-items:center;padding:0 20px;gap:18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(6,60,74,.10)}
.menu-btn{display:none;background:none;border:0;color:var(--navy);cursor:pointer}
.tsearch{margin-left:28px;position:relative;width:340px;max-width:34vw}
.tsearch input{background:#f2f6f4;border:1px solid var(--line);color:var(--text);padding-left:36px;border-radius:10px}
.tsearch input::placeholder{color:#7b8a96}
.tsearch svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7;width:16px}
.tsearch input:focus{background:#fff}
.sresults{position:absolute;top:44px;left:0;right:0;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;display:none;max-height:360px;overflow:auto}
.sresults.show{display:block}
.sresults a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--text)}
.sresults a:hover{background:var(--blue-l)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{background:none;border:0;color:var(--navy);padding:9px;border-radius:9px;cursor:pointer;position:relative;display:flex}
.iconbtn:hover{background:var(--blue-l)}
.dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:99px;background:#ef4444;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.userbtn{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);cursor:pointer;padding:5px 8px;border-radius:10px}
.userbtn:hover{background:var(--blue-l)}
.userbtn .nm{font-weight:600;font-size:13px;text-align:left;line-height:1.15}.userbtn .rl{font-size:11px;opacity:.7;font-weight:400}
.pop{position:absolute;right:0;top:54px;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 14px 44px rgba(10,29,68,.28);min-width:240px;padding:8px;display:none;z-index:60}
.pop.show{display:block}
.pop a,.pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text)}
.pop a:hover,.pop button:hover{background:var(--blue-l)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.notif{width:340px;max-height:420px;overflow:auto}
.notif .n{padding:10px;border-radius:8px;font-size:13px;display:block;color:var(--text)}
.notif .n.u{background:var(--blue-l)}
.layout{display:flex;min-height:calc(100vh - 64px)}
.side{width:244px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;flex:none}
.side h5{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a97ad}
.side a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#33415c;font-weight:500}
.side a:hover{background:#f3f6fc}
.side a.on{background:var(--blue-l);color:var(--blue);font-weight:700}
.side a .ct{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:700}
.main{flex:1;min-width:0;padding:24px 28px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px;letter-spacing:-.01em}.ph p{margin:4px 0 0;color:var(--muted)}
@media(max-width:900px){.menu-btn{display:flex}.side{position:fixed;left:-260px;z-index:70;top:64px;transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}.side.open{left:0}.main{padding:16px}.tsearch{display:none}.userbtn .nm{display:none}}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card.flat{box-shadow:none}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3 .l{display:flex;gap:8px;align-items:center}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em}.kpi .t{font-size:12px;color:var(--muted);font-weight:600}.kpi .s{font-size:12px}
.kcard{display:flex;gap:14px;align-items:center}
.kicon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eef1f7;color:#44546f;white-space:nowrap}
.badge.ok{background:var(--ok-l);color:var(--ok)}.badge.warn{background:var(--warn-l);color:var(--warn)}.badge.bad{background:var(--bad-l);color:var(--bad)}.badge.info{background:var(--info-l);color:var(--info)}.badge.pur{background:#f3e8ff;color:#7e22ce}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;object-fit:cover;overflow:hidden}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;width:100%}
table.t th{background:#f6f8fc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5a6a85;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:#fafbfe}
table.t tr.click{cursor:pointer}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.toolbar .search{min-width:240px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.prog{height:8px;background:#e8edf6;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--green));border-radius:99px}
.prog.g>i{background:linear-gradient(90deg,#16a34a,#4ade80)}.prog.r>i{background:linear-gradient(90deg,#dc2626,#f87171)}.prog.o>i{background:linear-gradient(90deg,#d97706,#fbbf24)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.fgrid .full{grid-column:1/-1}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500}
.steps{display:flex;gap:0;margin:6px 0 14px;overflow:auto}
.step{flex:1;min-width:110px;text-align:center;position:relative;font-size:11.5px;color:var(--muted);font-weight:600}
.step i{display:block;width:26px;height:26px;border-radius:50%;background:#e4e9f3;margin:0 auto 6px;line-height:26px;font-style:normal;color:#5a6a85;position:relative;z-index:1}
.step:before{content:"";position:absolute;top:12px;left:-50%;right:50%;height:2px;background:#e4e9f3}
.step:first-child:before{display:none}
.step.done i{background:var(--ok);color:#fff}.step.done:before{background:var(--ok)}
.step.cur i{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(6,138,162,.2)}.step.cur{color:var(--blue)}
.step.rej i{background:var(--bad);color:#fff}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .e{position:relative;padding-bottom:14px;font-size:13px}
.tl .e:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.kcol{background:#e9eef7;border-radius:12px;padding:10px;min-height:260px}
.kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#4a5a78;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kc{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(14,39,89,.1);cursor:pointer;font-size:13px}
.kc:hover{box-shadow:0 4px 12px rgba(14,39,89,.16)}
.react{display:inline-flex;gap:6px}
.rbtn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.rbtn:hover,.rbtn.on{background:var(--blue-l);border-color:#b6c6ee}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11.5px;font-weight:600;color:#44546f}
.mood button b{font-size:24px;font-weight:400}
.mood button:hover,.mood button.on{background:var(--blue-l);border-color:#9db3ea;color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:10.5px;color:var(--muted)}
.bars i{width:100%;background:linear-gradient(180deg,var(--green),var(--navy2));border-radius:6px 6px 0 0;min-height:3px}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:12.5px;margin:7px 0}
.banner{padding:12px 16px;border-radius:10px;background:var(--warn-l);color:#7c3e06;border:1px solid #f6d68b;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner.info{background:var(--info-l);color:#173c96;border-color:#b6caf7}
.tag{display:inline-block;background:#eef1f7;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:2px 4px 2px 0;color:#44546f}

/* ---------- Modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(10,20,45,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease}
.modal.wide{max-width:860px}.modal.xl{max-width:1040px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{font-size:17px}
.modal .body{padding:20px 22px;overflow:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfe;border-radius:0 0 16px 16px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;max-width:360px;font-size:13px}
.toast.ok{background:#166534}.toast.bad{background:#991b1b}

/* ---------- Leave calendar ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lg{padding:6px 14px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.02em;cursor:default;box-shadow:0 1px 2px rgba(0,0,0,.15);text-transform:uppercase}
.calw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 330px);min-height:320px}
table.cal{border-collapse:separate;border-spacing:0;font-size:11px}
table.cal th,table.cal td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;padding:0}
table.cal thead th{background:#f6f8fc;color:#44546f;font-weight:700;height:24px;position:sticky;z-index:3}
table.cal thead tr:nth-child(1) th{top:0}table.cal thead tr:nth-child(2) th{top:24px}table.cal thead tr:nth-child(3) th{top:48px}table.cal thead tr:nth-child(4) th{top:72px;background:#fff}table.cal thead tr:nth-child(5) th{top:96px;background:#fff}
table.cal .lab{position:sticky;left:0;z-index:4;background:#fff;text-align:left;padding:0 10px;min-width:190px;width:190px;font-weight:600;font-size:12.5px;border-right:2px solid var(--line)}
table.cal thead .lab{background:#f6f8fc;z-index:6;font-size:11px;color:#5a6a85}
table.cal td.c{width:30px;min-width:30px;height:36px;position:relative;cursor:pointer}
table.cal td.c:hover{background:#eef3ff}
table.cal td.we{background:#eceff5}table.cal td.we:hover{background:#e2e7f1}
table.cal td.ph{background:#fff3c4}table.cal td.hr{background:#fddddd}table.cal td.today{box-shadow:inset 0 0 0 2px #ef4444}
table.cal th.today{background:#ef4444!important;color:#fff}
table.cal td .x{color:#9aa7bd;font-size:10px}
.chip{position:absolute;inset:3px 2px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;line-height:1;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const D = {
  parse: s => { const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d,12); },
  iso: d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
  add: (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; },
  diff: (a,b) => Math.round((D.parse(b)-D.parse(a))/864e5),
  today: () => { const t = new Date(); t.setHours(12,0,0,0); return t; },
  todayIso: () => D.iso(D.today()),
  wk: d => { const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
};
const fmt = s => { if(!s) return '—'; const d = D.parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

/* ---------- bank holidays (computed; HR must verify annually) ---------- */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da,12); }
const PHC = {};
function phYear(y, region){
  const key = y+region; if(PHC[key]) return PHC[key];
  const out = {}; const add = (d,n) => { out[D.iso(d)] = n; };
  const dt = (m,d) => new Date(y,m,d,12);
  if(region==='UK'){
    let ny = dt(0,1); if(ny.getDay()===6) ny = dt(0,3); else if(ny.getDay()===0) ny = dt(0,2); add(ny,"New Year's Day"+(ny.getDate()!==1?' (substitute)':''));
    const e = easter(y); add(D.add(e,-2),'Good Friday'); add(D.add(e,1),'Easter Monday');
    const mon = (m,first) => { if(first){ let d = dt(m,1); while(d.getDay()!==1) d = D.add(d,1); return d; } let d = new Date(y,m+1,0,12); while(d.getDay()!==1) d = D.add(d,-1); return d; };
    add(mon(4,true),'Early May bank holiday'); add(mon(4,false),'Spring bank holiday'); add(mon(7,false),'Summer bank holiday');
    const dow = dt(11,25).getDay();
    if(dow===6){ add(dt(11,27),'Christmas Day (substitute)'); add(dt(11,28),'Boxing Day (substitute)'); }
    else if(dow===0){ add(dt(11,26),'Boxing Day'); add(dt(11,27),'Christmas Day (substitute)'); }
    else if(dow===5){ add(dt(11,25),'Christmas Day'); add(dt(11,28),'Boxing Day (substitute)'); }
    else { add(dt(11,25),'Christmas Day'); add(dt(11,26),'Boxing Day'); }
  } else {
    add(dt(1,5),'Kashmir Solidarity Day'); add(dt(2,23),'Pakistan Day'); add(dt(4,1),'Labour Day'); add(dt(7,14),'Independence Day'); add(dt(10,9),'Iqbal Day'); add(dt(11,25),'Quaid-e-Azam Day');
  }
  return PHC[key] = out;
}
function phName(iso, region){
  const y = +iso.slice(0,4); const n = phYear(y,region)[iso];
  if(n) return {type:'PH', name:n};
  const c = (DB.holidays||[]).find(h => h.date===iso && (h.region==='All'||h.region===region)); return c ? {type:'HR', name:c.name} : null;
}
const isWeekend = iso => { const g = D.parse(iso).getDay(); return g===0||g===6; };

/* ---------- leave engine ---------- */
function dayValue(rec, iso, region){ // working-day value of a record on a date
  if(iso<rec.start||iso>rec.end||isWeekend(iso)) return 0;
  if(rec.type==='HOL' && phName(iso,region)) return 0;
  return rec.half ? 0.5 : 1;
}
function recDays(rec, region){ let n=0; for(let d=D.parse(rec.start); D.iso(d)<=rec.end; d=D.add(d,1)) n += dayValue(rec, D.iso(d), region); return n; }
function entitlement(e, year){
  const base = (DB.settings.quota[e.region]||0) + (e.extraDays||0);
  let from = new Date(year,0,1,12), to = new Date(year,11,31,12);
  const s = D.parse(e.start), l = e.leaveDate ? D.parse(e.leaveDate) : null;
  if(s>from) from = s; if(l && l<to) to = l;
  if(to<from) return 0;
  const days = (to-from)/864e5+1, total = (new Date(year,11,31)-new Date(year,0,1))/864e5+1;
  return Math.round(base*days/total*2)/2;
}
function accrued(e, year, asOf){ // accrued to date (pro-rata by day, capped at entitlement)
  const ent = entitlement(e, year); const y0 = new Date(year,0,1,12), y1 = new Date(year,11,31,12);
  const a = asOf<y0 ? 0 : asOf>y1 ? 1 : ((asOf-y0)/864e5+1)/((y1-y0)/864e5+1);
  return Math.round(ent*a*2)/2;
}
function balance(e, year){
  const carry = (e.carry||{})[year]||0, ent = entitlement(e,year);
  let taken=0, upcoming=0, pending=0; const today = D.todayIso();
  DB.leave.filter(l => l.emp===e.id && l.type==='HOL' && l.status!=='rejected' && l.status!=='cancelled').forEach(l => {
    for(let d=D.parse(l.start); D.iso(d)<=l.end; d=D.add(d,1)){ const i = D.iso(d); if(+i.slice(0,4)!==year) continue; const v = dayValue(l,i,e.region); if(!v) continue;
      if(l.status==='pending') pending += v; else if(i<=today) taken += v; else upcoming += v; }
  });
  const total = ent+carry;
  return {ent, carry, total, taken, upcoming, pending, remaining: total-taken-upcoming, free: total-taken-upcoming-pending, acc: accrued(e,year,D.today())+carry};
}
function overlaps(empId, s, en, ignore){ return DB.leave.find(l => l.emp===empId && l.id!==ignore && l.status!=='rejected' && l.status!=='cancelled' && !(en<l.start||s>l.end)); }
function recFor(empId, iso){ return DB.leave.find(l => l.emp===empId && l.status!=='rejected' && l.status!=='cancelled' && iso>=l.start && iso<=l.end); }
function absentToday(iso=D.todayIso()){ return DB.leave.filter(l => l.status==='approved' && !LT[l.type].wfh && l.type!=='WFH' && l.type!=='HALF' && iso>=l.start && iso<=l.end && !isRest(emp(l.emp), iso) && emp(l.emp)?.status==='active' && !(l.type==='HOL' && phName(iso,emp(l.emp).region))); }
function sickRecords(empId, sinceIso){ return DB.leave.filter(l => LT[l.type].sick && l.emp===empId && l.status!=='rejected' && l.end>=sinceIso); }
function bradford(empId, asOf=D.todayIso()){
  const since = D.iso(D.add(D.parse(asOf),-364)); const recs = sickRecords(empId, since).filter(l=>l.start<=asOf);
  const spells = recs.length; let days = 0; recs.forEach(r => { days += recDays({...r,start:r.start<since?since:r.start,end:r.end>asOf?asOf:r.end}, emp(empId).region); });
  return {spells, days, score: spells*spells*days};
}
const bradLevel = s => { const t = DB.settings.bradford; return s>=t[2]?['Final stage','bad']:s>=t[1]?['Stage 2','bad']:s>=t[0]?['Stage 1','warn']:['Below trigger','ok']; };
function fridayMonday(empId){ const since = D.iso(D.add(D.today(),-182)); let fm=0, tot=0;
  sickRecords(empId,since).forEach(r => { for(let d=D.parse(r.start); D.iso(d)<=r.end; d=D.add(d,1)){ if(D.iso(d)<since||isWeekend(D.iso(d))) continue; tot++; if([1,5].includes(d.getDay())) fm++; } });
  return {fm, tot}; }

  const u = me(); const unread = DB.notes.filter(n => n.to===u.id && !n.read);
  const pend = isMgr() ? DB.leave.filter(l => l.status==='pending' && canApprove(l)).length : 0;
  const side = ['Main','People','Hiring','Employee Relations','Learning','Connect','Insights','Admin'].map(g => {
    const ps = PAGES.filter(p => p.g===g && allowed(p)); if(!ps.length) return '';
    return `<h5>${g}</h5>` + ps.map(p => `<a href="#/${p.id}" class="${p.id===pageId?'on':''}">${ico(p.icon)}<span>${p.label}</span>${p.id==='leave'&&pend?`<span class="ct">${pend}</span>`:''}</a>`).join('');
  }).join('');
  return `<header class="topbar">
    <button class="menu-btn" data-act="menu" aria-label="Menu">${ico('list')}</button>
    <a href="#/dashboard" style="color:#fff">${LOGO(true)}</a>
    <div class="tsearch">${ico('search')}<input id="gs" type="search" placeholder="Search people, policies, pages…" autocomplete="off"><div class="sresults" id="gsr"></div></div>
    <div class="tb-right">
      <div style="position:relative"><button class="iconbtn" data-act="pop" data-p="np" aria-label="Notifications">${ico('bell')}${unread.length?`<span class="dot">${unread.length}</span>`:''}</button>
        <div class="pop notif" id="np"><div class="row sp" style="padding:6px 10px"><b>Notifications</b><a href="#" data-act="readAll" onclick="return false" class="small">Mark all read</a></div>
        ${DB.notes.filter(n=>n.to===u.id).slice(0,12).map(n=>`<a class="n ${n.read?'':'u'}" href="#/${n.link||'dashboard'}">${esc(n.text)}<div class="small muted">${fmt(n.t)}</div></a>`).join('')||'<div class="empty">You are all caught up.</div>'}</div></div>
      <div style="position:relative"><button class="userbtn" data-act="pop" data-p="up">${av(u,34)}<span class="nm">${esc(u.name)}<br><span class="rl">${ROLES[u.role]}</span></span>${ico('chev')}</button>
        <div class="pop" id="up"><div style="padding:8px 10px"><b>${esc(u.name)}</b><div class="small muted">${esc(u.email)}</div></div><hr>
          <button data-act="myProfile">${ico('user')} My profile &amp; photo</button>
          <a href="#/leave">${ico('clock')} My leave</a>
          <button data-act="installHelp">${ico('down')} Use on my phone</button>
          ${isAdmin()?`<button data-act="resetDemo">${ico('trash')} Reset sample data</button>`:''}
          <hr><button data-act="logout">${ico('out')} Sign out</button></div></div>
    </div></header>
  <div class="layout"><nav class="side" id="side" aria-label="Main navigation">${side}</nav><main class="main" id="main">${inner}</main></div>
  <nav class="bnav" aria-label="Quick navigation">${[['dashboard','Home','home'],['calendar','Calendar','cal'],['leave','Leave','clock'],['noticeboard','News','flag']].map(([i,l,c])=>`<a href="#/${i}" class="${i===pageId?'on':''}">${ico(c)}${l}</a>`).join('')}<button data-act="menu">${ico('list')}Menu</button></nav>`;
}
ACT.menu = () => $('#side').classList.toggle('open');
document.addEventListener('click', e => { const s = $('#side'); if(s && s.classList.contains('open') && !e.target.closest('#side') && !e.target.closest('[data-act=menu]')) s.classList.remove('open'); if(e.target.closest('#side a')) s?.classList.remove('open'); });
ACT.pop = (el,e) => { e.stopPropagation(); const p = $('#'+el.dataset.p); const was = p.classList.contains('show'); $$('.pop').forEach(x=>x.classList.remove('show')); if(!was) p.classList.add('show'); };
ACT.readAll = () => { DB.notes.filter(n=>n.to===SESSION.uid).forEach(n=>n.read=true); saveDB(); render(); };
document.addEventListener('click', e => {
  if(!e.target.closest('.pop')) $$('.pop.show').forEach(x=>x.classList.remove('show'));
  if(!e.target.closest('.tsearch')) $('#gsr')?.classList.remove('show');
  if(!e.target.closest('.msel')) $$('.msel.open').forEach(x=>x.classList.remove('open'));
  const t = e.target.closest('[data-act]');
  if(t && ACT[t.dataset.act]){ if(t.tagName==='A') e.preventDefault(); ACT[t.dataset.act](t, e); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if(t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if(t && CHG[t.dataset.inp]) CHG[t.dataset.inp](t, e); if(e.target.id==='gs') globalSearch(e.target.value); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function globalSearch(q){
  const box = $('#gsr'); q = q.trim().toLowerCase(); if(q.length<2){ box.classList.remove('show'); return; }
  const res = [];
  if(isMgr()) DB.emps.filter(e=>e.name.toLowerCase().includes(q)||e.title.toLowerCase().includes(q)).slice(0,5).forEach(e=>res.push(`<a href="#/employees/${e.id}">${av(e,26)}<span>${esc(e.name)}<div class="small muted">${esc(e.title)}</div></span></a>`));
  DB.policies.filter(p=>(p.title+p.body).toLowerCase().includes(q)).slice(0,4).forEach(p=>res.push(`<a href="#/policies/${p.id}">${ico('book')}<span>${esc(p.title)}<div class="small muted">${p.cat} v${p.ver}</div></span></a>`));
  PAGES.filter(p=>allowed(p)&&p.label.toLowerCase().includes(q)).slice(0,4).forEach(p=>res.push(`<a href="#/${p.id}">${ico(p.icon)}<span>${p.label}</span></a>`));
  box.innerHTML = res.join('') || '<div class="empty">No matches</div>'; box.classList.add('show');
}

/* ---------- router ---------- */
function route(){ const [,id='dashboard',param=''] = location.hash.split('/'); return {id: id||'dashboard', param}; }
function render(){
  const root = $('#app'); const keep = { y: window.scrollY };
  if(!SESSION.uid){ root.innerHTML = loginView(); document.title = 'Sign in · PFG HR Management System'; return; }
  if(!accessActive(me())){ SESSION.uid = null; store.del('pfg_hrms_uid'); try{ sessionStorage.removeItem('pfg_hrms_uid'); }catch(e){} root.innerHTML = loginView(); return; }
  let {id, param} = route(); let page = PAGES.find(p => p.id===id);
  if(!page || !allowed(page)){ page = PAGES[0]; id = page.id; }
  ST.param = param;
  const prevMain = $('#main'); const sideScroll = $('#side')?.scrollTop||0;
  let inner; try { inner = VIEWS[id](param); } catch(err){ console.error(err); inner = `<div class="banner">Something went wrong rendering this page: ${esc(err.message)}</div>`; }
  root.innerHTML = shell(inner, id);
  if(me().mustChange && !$('#modal')) setTimeout(forcePwModal, 50);
  $('#side').scrollTop = sideScroll;
  document.title = page.label + ' · PFG HR';
  try { AFTER[id] && AFTER[id](param); } catch(err){ console.error(err); }
  if(prevMain) window.scrollTo(0, keep.y);
}
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0,0); });

function boot(){
  loadDB();
  const u = store.get('pfg_hrms_uid') || sessionStorage.getItem('pfg_hrms_uid');
  if(u && emp(u) && accessActive(emp(u))) SESSION.uid = u;
  if(SESSION.uid && typeof autoOnce==='function') autoOnce();
  render();
}
document.addEventListener('DOMContentLoaded', boot);

function reactBar(key){
  const r = DB.reactions[key] || {};
  return `<span class="react">${REACTS.map(([k,e,l]) => { const n = (r[k]||[]).length, on = (r[k]||[]).includes(SESSION.uid); return `<button class="rbtn ${on?'on':''}" data-act="react" data-key="${key}" data-k="${k}" title="${l}" aria-label="${l}">${e} ${n||''}</button>`; }).join('')}</span>`;
}
ACT.react = el => { const r = DB.reactions[el.dataset.key] ||= {}; const a = r[el.dataset.k] ||= []; const i = a.indexOf(SESSION.uid); i<0 ? a.push(SESSION.uid) : a.splice(i,1); saveDB(); render(); };
const reactCount = key => Object.values(DB.reactions[key]||{}).reduce((s,a)=>s+a.length,0);
const nextWorkday = (iso, who) => { const e = who && typeof who==='object' ? who : null, region = e ? e.region : who; let d = D.add(D.parse(iso),1); while((e ? isRest(e,D.iso(d)) : isWeekend(D.iso(d))) || phName(D.iso(d),region)) d = D.add(d,1); return D.iso(d); };
function upcomingDates(field, days){ // birthdays / anniversaries
  const t = D.today(), out = [];
  DB.emps.filter(e=>e.status==='active').forEach(e => { const s = e[field]; if(!s) return; const [,m,d] = s.split('-').map(Number);
    let n = new Date(t.getFullYear(), m-1, d, 12); if(D.iso(n) < D.iso(t)) n = new Date(t.getFullYear()+1, m-1, d, 12);
    const diff = D.diff(D.iso(t), D.iso(n)); if(diff<=days){ const yrs = n.getFullYear()-D.parse(s).getFullYear(); out.push({e, date:D.iso(n), diff, yrs}); } });
  return out.sort((a,b)=>a.diff-b.diff);
}

/* ---------------- LEAVE CALENDAR ---------------- */
const mondayOf = d => D.add(d, -((d.getDay()+6)%7));
function calState(){ return ST.cal ||= { start: D.iso(mondayOf(D.today())), weeks:5, depts:[], q:'', leavers:false, brush:'HOL', half:'' }; }
function calEmps(){ const s = calState(); let list = visibleEmps({leavers: isHR() && s.leavers});
  if(s.depts.length) list = list.filter(e => e.depts.some(d => s.depts.includes(d)));
  if(s.q) list = list.filter(e => e.name.toLowerCase().includes(s.q.toLowerCase()));
  return list.sort((a,b)=>a.name.localeCompare(b.name)); }
function chipFor(rec, e){
  const t = LT[rec.type]; const hide = t.sick && !isMgr() && e.id!==SESSION.uid;
  const bg = hide ? '#d6dbe6' : t.c, fg = hide ? '#44546f' : t.fg, lab = hide ? 'OFF' : t.code;

/* ---------- Leave request / detail ---------- */
const TYPES_BY_ROLE = () => isHR() ? Object.keys(LT) : isMgr() ? ['HOL','WFH','SICK','SICK_SSP','LATE','UNAUTH','PAT'] : ['HOL','WFH','SICK'];

    <div class="field"><label>From</label><input type="date" name="start" value="${d}" data-chg="leaveCalc" max="${D.iso(D.add(D.today(),365*2))}"></div>
    <div class="field"><label>To</label><input type="date" name="end" value="${d}" data-chg="leaveCalc" max="${D.iso(D.add(D.today(),365*2))}"></div>
    <div class="field"><label class="row" style="gap:8px;margin:0"><input type="checkbox" name="half" style="width:auto" data-chg="leaveCalc"> Half day (single date only)</label></div>
    <div class="field"><select name="ampm" data-chg="leaveCalc"><option value="AM">Morning off</option><option value="PM">Afternoon off</option></select></div>
    <div class="field full"><label>Notes</label><textarea name="note" placeholder="Optional"></textarea></div></div>
    <div id="lsum" class="banner info"></div><div id="lerr" class="err" role="alert"></div></form>`,
    actions:[{label:'Cancel',act:'closeModal'},{label:'Submit',cls:'pri',act:'saveLeave'}]});
  CHG.leaveCalc();
}
ACT.leaveModal = () => leaveModal();
ACT.sickModal = () => leaveModal({type:'SICK'});
function leaveFormRec(){ const f = $('#lf'); const half = f.half.checked && f.start.value===f.end.value;
  return { emp:f.emp.value, type:f.type.value, start:f.start.value, end:f.end.value, half: half ? f.ampm.value : null, note:f.note.value.trim() }; }
function daysByYear(rec, region){ const out = {}; for(let d=D.parse(rec.start); D.iso(d)<=rec.end; d=D.add(d,1)){ const i = D.iso(d), v = dayValue(rec,i,region); if(v) out[i.slice(0,4)] = (out[i.slice(0,4)]||0)+v; } return out; }
function leaveProblems(rec, ignore){
  const e = emp(rec.emp), u = me(), p = [];
  if(!rec.start || !rec.end) return ['Choose a start and end date.'];
  if(rec.end < rec.start) return ['The end date cannot be before the start date.'];
  if(rec.end > D.iso(D.add(D.today(),365*2+1))) p.push('Leave can be planned up to two years ahead.');
  if(rec.start < D.iso(D.add(D.today(),-60)) && !isHR()) p.push('Requests more than 60 days in the past must be entered by HR.');
  const by = daysByYear(rec, e.region), total = Object.values(by).reduce((a,b)=>a+b,0);
  if(!total && !['MAT_PAID','MAT_SSP','PAT'].includes(rec.type)) p.push('No working days in the selected range (weekends and public holidays are excluded).');
  const o = overlaps(rec.emp, rec.start, rec.end, ignore); if(o) p.push(`Overlaps an existing ${LT[o.type].name} entry (${fmtS(o.start)}–${fmtS(o.end)}).`);
  if(rec.type==='HOL'){ Object.entries(by).forEach(([y,n]) => { const b = balance(e,+y); const extra = ignore ? (DB.leave.find(l=>l.id===ignore) ? (daysByYear(DB.leave.find(l=>l.id===ignore),e.region)[y]||0) : 0) : 0;
      if(n > b.free + extra + 1e-9) p.push(`Only ${num1(b.free+extra)} day(s) available in ${y}; this request needs ${num1(n)}.${isHR()?' (HR may override.)':''}`); }); }
  return p;
}
CHG.leaveCalc = () => { const f = $('#lf'); if(!f) return; if(f.start.value && (!f.end.value || f.end.value<f.start.value) ) f.end.value = f.start.value;
  const single = f.start.value===f.end.value; f.half.disabled = !single; if(!single) f.half.checked = false; f.ampm.disabled = !f.half.checked;
  const rec = leaveFormRec(), e = emp(rec.emp), by = daysByYear(rec, e.region), total = Object.values(by).reduce((a,b)=>a+b,0);
  const b = balance(e, +(rec.start||D.todayIso()).slice(0,4));
  $('#lsum').innerHTML = `${ico('cal')} <span><b>${num1(total)}</b> working day(s)${rec.type==='HOL'?` · balance in ${(rec.start||'').slice(0,4)}: <b>${num1(b.free)}</b> available → <b>${num1(b.free-(by[(rec.start||'').slice(0,4)]||0))}</b> after this request`:''}</span>`;
};
function submitLeave(rec){
  const e = emp(rec.emp), u = me();
  const probs = leaveProblems(rec);
  const hard = probs.filter(p => !(isHR() && /available in/.test(p)));
  if(hard.length) return {ok:false, errors:hard};
  const self = e.id===u.id;
  const auto = LT[rec.type].sick || !['HOL','WFH'].includes(rec.type) ? true : (!self && manageable().some(x=>x.id===e.id));
  const r = { id:uid('l'), ...rec, status: auto ? 'approved' : 'pending', created:D.todayIso(), by:u.id };
  DB.leave.push(r); log('Leave '+(auto?'recorded':'requested'), `${LT[r.type].name} ${r.start}→${r.end} for ${e.name}`, e.id);
  if(r.status==='pending'){ const ap = managersOf(e).filter(x=>x!==u.id); const hr = DB.emps.filter(x=>x.role==='hr'||x.role==='admin').map(x=>x.id).filter(x=>x!==u.id);
    notify(ap.length?ap:hr, `${e.name} requested ${LT[r.type].name.toLowerCase()} (${fmtS(r.start)}${r.end!==r.start?'–'+fmtS(r.end):''}) – approval needed.`, 'leave'); }
  if(LT[r.type].sick){ const due = nextWorkday(r.end, e); DB.rtw.push({id:uid('rtw'), emp:e.id, absId:r.id, due, status:'Due'});
    notify([...managersOf(e)], `Return-to-work form due for ${e.name} by ${fmt(due)} (after absence ${fmtS(r.start)}–${fmtS(r.end)}).`, 'leave');
    const b = bradford(e.id); const [lv] = bradLevel(b.score); if(lv!=='Below trigger') notify(DB.emps.filter(x=>x.role==='hr'||x.role==='admin').map(x=>x.id), `${e.name} has reached Bradford Factor ${b.score} (${lv}).`, 'reports'); }
  saveDB();
  return {ok:true, rec:r, auto, days:recDays(r,e.region)};
}
ACT.saveLeave = () => {
  const er = $('#lerr'); const res = submitLeave(leaveFormRec());
  if(!res.ok){ er.innerHTML = res.errors.map(esc).join('<br>'); er.classList.add('show'); return; }
  closeModal(); toast(res.auto?'Recorded':'Request submitted for approval','ok'); render();
};
function leaveDetail(id){

    <dl class="dl"><dt>Dates</dt><dd>${fmt(l.start)}${l.end!==l.start?' – '+fmt(l.end):''}${l.half?` (${l.half==='AM'?'morning':'afternoon'} off)`:''}</dd><dt>Working days</dt><dd>${num1(recDays(l,e.region))}</dd>${hide?'':`<dt>Notes</dt><dd>${esc(l.note)||'—'}</dd>`}<dt>Requested</dt><dd>${fmt(l.created)}${l.by&&l.by!==l.emp?' by '+esc(empName(l.by)):''}</dd>${l.decision?`<dt>Decision</dt><dd>${esc(l.decision)}</dd>`:''}</dl>`,
    actions:[ ...(l.status==='pending' && canApprove(l) ? [{label:'Reject',cls:'bad',act:'rejectLeave',data:`data-id="${id}"`},{label:'Approve',cls:'ok',act:'approveLeave',data:`data-id="${id}"`}] : []),

function leaveMy(){
  const u = me(), y0 = D.today().getFullYear(), yr = +(ST.f.leaveYear||y0), b = balance(u,yr);

/* ---- click / drag to book on the calendar ---- */
const DRAG = { on:false, emp:null, a:null, b:null };
function dragPaint(){
  $$('td.c.sel').forEach(x=>x.classList.remove('sel'));
  if(!DRAG.on) return; const lo = DRAG.a<DRAG.b?DRAG.a:DRAG.b, hi = DRAG.a<DRAG.b?DRAG.b:DRAG.a;
  $$(`td.c[data-emp="${DRAG.emp}"]`).forEach(x=>{ if(x.dataset.date>=lo && x.dataset.date<=hi) x.classList.add('sel'); });
}
document.addEventListener('mousedown', e => {
  const td = e.target.closest('td.c'); if(!td || route().id!=='calendar' || e.button!==0) return;
  const s = calState(); if(s.brush==='view') return;
  const em = emp(td.dataset.emp);
  if(!(em.id===SESSION.uid || manageable().some(x=>x.id===em.id))){ toast('You can only book on your own row'+(isMgr()?' or your team’s.':'.')); return; }
  DRAG.on = true; DRAG.emp = em.id; DRAG.a = DRAG.b = td.dataset.date; dragPaint(); e.preventDefault();
});
document.addEventListener('mouseover', e => { if(!DRAG.on) return; const td = e.target.closest('td.c'); if(td && td.dataset.emp===DRAG.emp){ DRAG.b = td.dataset.date; dragPaint(); } });
document.addEventListener('mouseup', e => {
  if(!DRAG.on) return; DRAG.on = false; const s = calState(); const em = emp(DRAG.emp);
  let lo = DRAG.a<DRAG.b?DRAG.a:DRAG.b, hi = DRAG.a<DRAG.b?DRAG.b:DRAG.a; dragPaint();
  while(lo<=hi && isRest(em,lo)) lo = D.iso(D.add(D.parse(lo),1)); while(hi>=lo && isRest(em,hi)) hi = D.iso(D.add(D.parse(hi),-1));
  if(lo>hi){ toast('That is a rest day on this shift pattern.'); return; }
  const single = lo===hi, existing = single && recFor(em.id, lo);
  if(existing){ leaveDetail(existing.id); return; }
  const half = single && s.half ? s.half : null; if(s.half && !single) toast('Day part applies to a single day – booked as full days.');
  const res = submitLeave({emp:em.id, type:s.brush, start:lo, end:hi, half, note:''});
  if(!res.ok){ toast(res.errors[0], 'bad'); return; }
  const w = $('.calw'); ST.calScroll = w ? [w.scrollLeft, w.scrollTop] : null;
  toast(res.auto ? `${LT[s.brush].name} recorded – ${num1(res.days)} day(s)` : `${LT[s.brush].name} requested – ${num1(res.days)} day(s), awaiting approval`, 'ok'); render();
});

const submitOnce = (el, fn) => { if(el.dataset.busy) return; el.dataset.busy = 1; el.disabled = true; try { fn(); } finally { setTimeout(()=>{ delete el.dataset.busy; el.disabled = false; }, 600); } };

VIEWS.employees = (param) => param ? empProfile(param) : empList();
function empList(){
  const f = ST.f.emp ||= {q:'',dept:'',region:'',status:'active'};
  let list = (isHR()?DB.emps:manageable()).filter(e => (!f.q || (e.name+e.title+e.email).toLowerCase().includes(f.q.toLowerCase())) && (!f.dept || e.depts.includes(f.dept)) && (!f.region || e.region===f.region) && (!f.status || e.status===f.status));
  list = list.sort((a,b)=>a.name.localeCompare(b.name));
  return pageHead('Personnel Files', isHR()?'Core HR master data – every change is versioned and audited.':'Your team’s records (limited fields).',
    `<button class="btn" data-act="exportEmps">${ico('down')} Export</button>${isHR()?`<button class="btn pri" data-act="addEmp">${ico('plus')} Add employee</button>`:''}`) +
  `<div class="toolbar"><input type="search" class="search" placeholder="Search name, title or email" value="${esc(f.q)}" data-inp="empQ" id="eq"><select data-chg="empF" data-k="dept"><option value="">All departments</option>${deptOptions(f.dept)}</select><select data-chg="empF" data-k="region"><option value="">All regions</option>${REGIONS.map(r=>`<option ${f.region===r?'selected':''}>${r}</option>`).join('')}</select>${isHR()?`<select data-chg="empF" data-k="status"><option value="">Active &amp; leavers</option><option value="active" ${f.status==='active'?'selected':''}>Active</option><option value="leaver" ${f.status==='leaver'?'selected':''}>Leavers</option></select>`:''}<span class="muted small">${list.length} records</span></div>` +
  table([{h:'Employee',f:e=>`<div class="row">${av(e,34)}<div><b>${esc(e.name)}</b><div class="small muted">${esc(e.title)}</div></div></div>`},{h:'Department(s)',f:e=>esc(e.depts.join(' / '))},{h:'Company',f:e=>esc(e.company)},{h:'Region',f:e=>e.region},{h:'Manager',f:e=>esc(empName(e.mgr))},{h:'Start',f:e=>fmt(e.start)},{h:'Status',f:e=>e.status==='active'?badge('Active','ok'):badge('Leaver '+fmt(e.leaveDate),'bad')}], list, {row:e=>`class="click" data-act="openEmp" data-id="${e.id}"`});
}

function empProfile(id){
  const e = emp(id); if(!e) return `<div class="banner">Employee not found. <a href="#/employees">Back</a></div>`;
  if(!isHR() && !manageable().some(x=>x.id===e.id) && e.id!==SESSION.uid) return `<div class="banner">${ico('lock')} You do not have access to this record.</div>`;
  const hrView = isHR(), k = tabOf('prof-'+id,'personal'), yr = curLY(e), b = balance(e,yr);
  const tabs = [['personal','Personal'],['employment','Employment'],['relationships','Relationships'],['dates','Key dates'],['allow','Allowance'],['shift','Shift pattern'],...(hrView?[['bank','Banking & tax']]:[]),['disc','Disciplinary'],['docs','Documents'],['hist','Version history']];
  const dl = rows => `<dl class="dl">${rows.map(([a,c])=>`<dt>${a}</dt><dd>${c||'—'}</dd>`).join('')}</dl>`;
  const body = {
    personal: dl([['Full name',esc(e.name)],['Email',esc(e.email)],['Phone',esc(e.phone)],['Date of birth',fmt(e.dob)],['Region',e.region]]),
    employment: dl([['Job title',esc(e.title)],['Company',esc(e.company)],['Department(s)',esc(e.depts.join(' / '))],['Line manager',esc(empName(e.mgr))],['Manages',esc(e.manages.join(', '))],['Contract',esc(e.contract)],['FTE',e.fte],['Grade',esc(e.grade)],['Access role',ROLES[e.role]],['Sign-in type',esc(e.signInType||'Company Microsoft account')],['Sign-in email',esc(loginEmail(e))],['Portal access',accessActive(e)?'Active':'<b style="color:var(--bad)">Disabled</b>'+(e.access&&e.access.reason?' – '+esc(e.access.reason):'')]]),
    relationships: dl([['Line manager',esc(empName(e.mgr))],['Direct reports',DB.emps.filter(x=>x.mgr===e.id&&x.status==='active').map(x=>esc(x.name)).join(', ')],['Emergency contact',esc(e.emergency.name)],['Relationship',esc(e.emergency.rel)],['Emergency phone',esc(e.emergency.phone)]]),
    dates: dl([['Start date',fmt(e.start)],['Length of service',`${Math.floor(D.diff(e.start,D.todayIso())/365.25)} years ${Math.floor((D.diff(e.start,D.todayIso())%365.25)/30.4)} months`],['Date of birth',fmt(e.dob)],['Next anniversary',fmt(upcomingDates('start',366).find(x=>x.e.id===e.id)?.date)],['Probation end',fmt(D.iso(D.add(D.parse(e.start),90)))],['Leaving date',e.leaveDate?fmt(e.leaveDate):'']]),
    allow: `<div class="grid g3">${[yr,yr+1,yr+2].map(y=>{ const bb = balance(e,y); return `<div class="card flat"><h3>${lyLabel(e,y)}</h3><dl class="dl" style="grid-template-columns:1fr auto"><dt>Entitlement</dt><dd>${num1(bb.ent)}</dd><dt>Carried</dt><dd>${num1(bb.carry)}</dd><dt>Taken</dt><dd>${num1(bb.taken)}</dd><dt>Booked</dt><dd>${num1(bb.upcoming)}</dd><dt>Pending</dt><dd>${num1(bb.pending)}</dd><dt><b>Remaining</b></dt><dd><b>${num1(bb.remaining)}</b></dd>${bb.sickEnt?`<dt>Sick allowance</dt><dd>${num1(bb.sickTaken)} / ${num1(bb.sickEnt)}</dd>`:''}</dl></div>`; }).join('')}</div>`,
    shift: shiftTab(e, hrView),
    bank: `<div class="banner info">${ico('lock')}<span>Special-category and financial fields are masked and visible to HR only. Access is logged.</span></div>`+dl([['Bank (masked)',esc(e.bank)],['Tax code',esc(e.tax)],['NI number (masked)',esc(e.ni)]]),
    disc: table([{h:'Date',f:d=>fmt(d.date)},{h:'Level',f:d=>esc(d.level)},{h:'Reason',f:d=>esc(d.reason)}], e.disc, {empty:'No disciplinary history.'}) + (DB.cases.filter(c=>c.emp===e.id).length?`<p class="small muted" style="margin-top:10px">Linked cases: ${DB.cases.filter(c=>c.emp===e.id).map(c=>`<a href="#/cases">${c.id}</a>`).join(', ')}</p>`:''),
    docs: `<div class="row sp" style="margin-bottom:10px"><span class="muted small">Attachments are limited to 300 KB in this prototype (production uses SharePoint with retention rules).</span>${hrView||e.id===SESSION.uid?`<label class="btn sm pri" style="cursor:pointer">${ico('up')} Upload<input type="file" hidden data-chg="docUp" data-id="${e.id}"></label>`:''}</div>`+table([{h:'File',f:d=>esc(d.name)},{h:'Size',f:d=>Math.round(d.size/1024)+' KB'},{h:'Uploaded',f:d=>fmtDT(d.t)},{h:'By',f:d=>esc(d.by)},{h:'',cls:'right',f:(d)=>`<button class="btn sm" data-act="docGet" data-id="${e.id}" data-n="${esc(d.name)}">${ico('down')}</button>`}], e.docs, {empty:'No documents attached.'}),
    hist: `<div class="tl">${e.history.map(h=>`<div class="e"><b>${esc(h.what)}</b><div class="small muted">${fmtDT(h.t)} · ${esc(h.by)}</div></div>`).join('')}</div>`
  }[k];
  return `<p><a href="#/employees">← Personnel files</a></p>
  <div class="card" style="margin-bottom:16px"><div class="row wrap">${av(e,72)}<div class="grow"><h1 style="font-size:22px">${esc(e.name)}</h1><div class="muted">${esc(e.title)} · ${esc(e.depts.join(' / '))} · ${esc(e.company)}</div><div style="margin-top:6px">${e.status==='active'?badge('Active','ok'):badge('Leaver','bad')} ${badge(e.region)} ${badge(ROLES[e.role],'info')}</div></div>
    <div class="row wrap">${hrView?`<button class="btn" data-act="editEmp" data-id="${e.id}">${ico('edit')} Edit</button><button class="btn" data-act="resendCred" data-id="${e.id}">${ico('mail')} Resend sign-in</button><button class="btn ${accessActive(e)?'bad':'ok'}" data-act="accessToggle" data-id="${e.id}">${accessActive(e)?'Disable access':'Enable access'}</button>`:''}<button class="btn" data-act="exportOne" data-id="${e.id}">${ico('down')} Export</button></div></div></div>
  ${tabsHtml('prof-'+id, tabs, 'personal')}<div class="card">${body}</div>`;
}
ACT.exportOne = el => { const e = emp(el.dataset.id); csvDownload('employee_'+e.name.replace(/ /g,'_'), ['Field','Value'], [['Name',e.name],['Title',e.title],['Email',e.email],['Departments',e.depts.join(' / ')],['Company',e.company],['Region',e.region],['Manager',empName(e.mgr)],['Start',e.start],['Contract',e.contract],['Shift',e.shift]]); };
CHG.docUp = el => { const f = el.files[0]; if(!f) return; if(f.size>300*1024){ toast('File is larger than 300 KB.','bad'); el.value=''; return; }
  const r = new FileReader(); r.onload = () => { const e = emp(el.dataset.id); e.docs.unshift({name:f.name,size:f.size,t:nowStamp(),by:me().name,data:r.result}); e.history.unshift({t:nowStamp(),by:me().name,what:'Document attached: '+f.name}); log('Document uploaded',f.name,e.id); saveDB(); toast('Document attached','ok'); render(); }; r.readAsDataURL(f); };
ACT.docGet = el => { const d = emp(el.dataset.id).docs.find(x=>x.name===el.dataset.n); const a = document.createElement('a'); a.href = d.data; a.download = d.name; document.body.appendChild(a); a.click(); a.remove(); log('Document downloaded',d.name,el.dataset.id); };

const EMP_FIELDS = [['name','Full name','text'],['title','Job title','text'],['email','Work email','email'],['phone','Phone','text'],['signInType','Sign-in type','sel:Company Microsoft account|Personal email account'],['personalEmail','Personal email (sign-in email for personal accounts, and welcome pack)','email'],['dob','Date of birth','date'],['start','Start date','date'],['company','Company','sel:'+COMPANIES.join('|')],['region','Region','sel:UK|PK'],['contract','Contract','text'],['fte','FTE','number'],['grade','Grade','text'],['shift','Shift pattern','text'],['role','Access role','sel:employee|manager|hr|admin']];
function empForm(e){
  const mgrs = DB.emps.filter(x=>x.status==='active' && x.id!==e.id);
  return `<form id="ef" onsubmit="return false"><div class="fgrid">${EMP_FIELDS.map(([k,l,t])=>`<div class="field"><label>${l}</label>${t.startsWith('sel:')?`<select name="${k}">${t.slice(4).split('|').map(o=>`<option value="${o}" ${String(e[k])===o?'selected':''}>${k==='role'?ROLES[o]:o}</option>`).join('')}</select>`:`<input type="${t}" name="${k}" value="${esc(e[k]??'')}" ${t==='number'?'step="0.1" min="0.1" max="1"':''}>`}</div>`).join('')}
  <div class="field"><label>Line manager</label><select name="mgr"><option value="">— None —</option>${empOptions(mgrs,e.mgr)}</select></div>
  <div class="field full"><label>Department(s) – select one or more</label><div class="row wrap">${DB.depts.map(d=>`<label class="row" style="gap:5px;margin:0;font-weight:500"><input type="checkbox" style="width:auto" name="dep" value="${esc(d)}" ${e.depts.includes(d)?'checked':''}> ${esc(d)}</label>`).join('')}</div></div></div><div id="eerr" class="err"></div></form>`;
}
ACT.editEmp = el => { const e = emp(el.dataset.id); modal({title:'Edit – '+esc(e.name),size:'wide',body:empForm(e),actions:[{label:'Cancel',act:'closeModal'},{label:'Save changes',cls:'pri',act:'saveEmp',data:`data-id="${e.id}"`}]}); };
ACT.addEmp = () => { const e = {id:'new',name:'',title:'',email:'',phone:'',dob:'',start:D.todayIso(),company:'PFG Group',region:'UK',contract:'Permanent',fte:1,grade:'G3',shift:'Mon–Fri 09:00–17:30',role:'employee',mgr:'',depts:[],signInType:'Company Microsoft account'}; modal({title:'Add employee',size:'wide',body:empForm(e),actions:[{label:'Cancel',act:'closeModal'},{label:'Create record',cls:'pri',act:'saveEmp',data:'data-id="new"'}]}); };
ACT.saveEmp = el => submitOnce(el, () => {
  const f = $('#ef'), er = $('#eerr'), isNew = el.dataset.id==='new', e = isNew ? {id:'e'+(Math.max(...DB.emps.map(x=>+x.id.slice(1)))+1),status:'active',manages:[],carry:{},extraDays:0,emergency:{name:'',rel:'',phone:''},bank:'•••• (to be entered)',tax:'—',ni:'—',docs:[],history:[],disc:[]} : emp(el.dataset.id);
  const v = {}; EMP_FIELDS.forEach(([k,,t]) => v[k] = t==='number' ? +f[k].value : f[k].value.trim()); v.mgr = f.mgr.value || null; v.depts = $$('input[name=dep]:checked',f).map(x=>x.value);
  const errs = [];
  if(v.name.length<2) errs.push('Full name is required.'); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) errs.push('Enter a valid email address.');
  if(DB.emps.some(x=>x.id!==e.id && x.email.toLowerCase()===v.email.toLowerCase())) errs.push('That email is already used by another employee.');
  if(!v.dob || !v.start) errs.push('Date of birth and start date are required.'); else if(D.diff(v.dob,v.start) < 16*365) errs.push('Employee must be at least 16 years old at start date.');
  if(v.signInType==='Personal email account' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.personalEmail)) errs.push('A personal email is required for personal-email sign-in.');
  if(DB.emps.some(x=>x.id!==e.id && loginEmails(x).some(m=>[v.email.toLowerCase(), (v.signInType==='Personal email account'?v.personalEmail.toLowerCase():'')].includes(m)))) errs.push('That sign-in email is already used by another employee.');
  if(!v.depts.length) errs.push('Select at least one department.'); if(!(v.fte>0 && v.fte<=1)) errs.push('FTE must be between 0.1 and 1.');
  if(errs.length){ er.innerHTML = errs.map(esc).join('<br>'); er.classList.add('show'); return; }
  if(isNew){ Object.assign(e, v); DB.emps.push(e); e.history.unshift({t:nowStamp(),by:me().name,what:'Record created'}); log('Employee created', e.name, e.id); onNewEmployee(e); }
  else { const diffs = []; Object.keys(v).forEach(k => { const a = JSON.stringify(e[k]), b = JSON.stringify(v[k]); if(a!==b) diffs.push(`${k}: ${Array.isArray(e[k])?e[k].join('/'):e[k]??'—'} → ${Array.isArray(v[k])?v[k].join('/'):v[k]??'—'}`); Object.assign(e, {[k]:v[k]}); });
    if(diffs.length){ e.history.unshift({t:nowStamp(),by:me().name,what:'Updated – '+diffs.join('; ')}); log('Employee updated', diffs.join('; '), e.id); } }
  saveDB(); closeModal(); toast('Saved','ok'); if(isNew) location.hash = '#/employees/'+e.id; else render();
});

CHG.photo = el => { const f = el.files[0]; if(!f) return; if(!/^image\//.test(f.type)) return toast('Please choose an image.','bad'); const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'), s = 200, m = Math.min(img.width,img.height); c.width = c.height = s; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s); me().photo = c.toDataURL('image/jpeg',.82); me().history.unshift({t:nowStamp(),by:me().name,what:'Profile photo updated'}); log('Profile photo updated',''); saveDB(); closeModal(); toast('Photo updated','ok'); render(); }; img.src = r.result; }; r.readAsDataURL(f); };
ACT.rmPhoto = () => { me().photo = null; saveDB(); closeModal(); render(); };
ACT.saveMyProfile = () => { const f = $('#mp'), u = me(); u.phone = f.phone.value.trim(); u.emergency = {name:f.en.value.trim(),rel:f.er.value.trim(),phone:f.ep.value.trim()}; u.history.unshift({t:nowStamp(),by:u.name,what:'Contact details updated by employee'}); saveDB(); closeModal(); toast('Profile saved','ok'); };

VIEWS.orgchart = () => {
  const act = DB.emps.filter(e=>e.status==='active'); const kids = id => act.filter(e=>e.mgr===id);
  const node = e => `<li><div class="onode" ${isMgr()?`data-act="openEmp" data-id="${e.id}"`:''}>${av(e,42)}<b>${esc(e.name)}</b><span>${esc(e.title)}</span><span>${esc(e.depts.join(' / '))} · ${e.region}</span></div>${kids(e.id).length?`<ul>${kids(e.id).map(node).join('')}</ul>`:''}</li>`;
  const roots = act.filter(e=>!e.mgr || !act.some(x=>x.id===e.mgr));
  return pageHead('Organisation Chart','Reporting lines across PFG Group (UK & PK). Click a person to open their file.') + `<div class="card"><div class="org"><ul>${roots.map(node).join('')}</ul></div></div>`;
};

VIEWS.probation = () => {

VIEWS.rota = () => {

CHG.bulkCSV = el => { const f = el.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { const rows = r.result.replace(/^﻿/,'').split(/\r?\n/).filter(Boolean).slice(1); let n = 0, bad = 0; rows.forEach(line => { const m = line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)?.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')); if(!m || m.length<5 || !/^[^@\s]+@[^@\s]+$/.test(m[1]) || !DB.jobs.some(j=>j.id===m[2])){ bad++; return; } DB.candidates.push({id:uid('c'),name:m[0],email:m[1],job:m[2],source:m[3]||'Upload',stage:'Sourcing',cv:m[4]||'',scores:{}}); n++; }); log('Bulk candidate upload',`${n} added, ${bad} rejected`); saveDB(); closeModal(); toast(`${n} added${bad?`, ${bad} rows rejected`:''}`, bad?'':'ok'); render(); }; r.readAsText(f); };

function candModal(id){
  const c = DB.candidates.find(x=>x.id===id), j = DB.jobs.find(x=>x.id===c.job), si = STAGES.indexOf(c.stage), sk = parseCV(c.cv), jk = parseCV((j?.title||'')+' '+DB.candidates.filter(x=>x.job===c.job&&x.stage==='Hired').map(x=>x.cv).join(' '));
  const stageNo = si>=2 && si<=3 ? si-1 : null;
  modal({title:esc(c.name),size:'wide',body:`<div class="row sp wrap"><div><div class="muted">${esc(c.email)} · ${esc(c.source)}</div><div>Applied for <b>${esc(j?.title||'—')}</b></div></div>${statusBadge(c.stage)}</div>
  <div class="steps" style="margin-top:12px">${STAGES.map((s,i)=>`<div class="step ${i<si?'done':i===si?'cur':''}"><i>${i+1}</i>${s}</div>`).join('')}</div>
  <div class="grid g2"><div><h4>Parsed skills</h4><div style="margin-top:6px">${sk.map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'<span class="muted">None detected</span>'}</div><h4 style="margin-top:14px">CV</h4><p class="small muted">${esc(c.cv)||'—'}</p></div>
  <div><h4>Scoring matrix</h4>${[1,2].map(n=>{ const s = c.scores[n]; return `<div class="card flat" style="padding:10px;margin-top:8px"><div class="row sp"><b>Interview ${n}</b>${s?`<span>★ ${(Object.values(s).reduce((a,b)=>a+b,0)/CRIT.length).toFixed(1)}</span>`:(stageNo===n?badge('Score now','warn'):'<span class="muted small">Not scored</span>')}</div>${s?`<div class="small muted">${CRIT.map(k=>`${k} ${s[k]}`).join(' · ')}</div>`:''}${!s&&(stageNo===n||si>=n+1)?`<button class="btn sm" style="margin-top:6px" data-act="scoreCand" data-id="${id}" data-n="${n}">Enter scores</button>`:''}</div>`; }).join('')}</div></div>`,
  actions:[{label:'Close',act:'closeModal'},{label:'Reject',cls:'bad',act:'candReject',data:`data-id="${id}"`},...(si>=2&&si<=3?[{label:'Schedule (.ics)',act:'candIcs',data:`data-id="${id}"`}]:[]),...(si>0?[{label:'← Back',act:'candMove',data:`data-id="${id}" data-d="-1"`}]:[]),...(si<STAGES.length-1?[{label:'Move to '+STAGES[si+1]+' →',cls:'pri',act:'candMove',data:`data-id="${id}" data-d="1"`}]:[])]});
}
ACT.candMove = el => { const c = DB.candidates.find(x=>x.id===el.dataset.id), d = +el.dataset.d, ni = STAGES.indexOf(c.stage)+d; if([4].includes(ni) && STAGES.indexOf(c.stage)<4 && !Object.keys(c.scores).length && !isAdmin()) return toast('Record at least one interview score before making an offer.','bad');
  c.stage = STAGES[ni]; log('Candidate moved', `${c.name} → ${c.stage}`); if(c.stage==='Hired'){ DB.onboarding.push({id:uid('ob'),emp:null,name:c.name,start:D.todayIso(),tasks:ONB_TASKS.map(t=>({t,d:0}))}); toast('Hired – onboarding checklist created','ok'); } saveDB(); closeModal(); render(); };

/* ---------------- ONBOARDING & EXIT ---------------- */
const ONB_TASKS = ['Contract signed','Right-to-Work check (share code / PVN)','IT account & laptop issued','One Bill credentials emailed','Clocking card issued (Attendance Mgmt)','Policies acknowledged','Induction / orientation scheduled'];
VIEWS.onboarding = () => {
  const k = tabOf('onb','on'); if(k==='sp') return spAdmin();
  const on = DB.onboarding.map(o => { const done = o.tasks.filter(t=>t.d).length, pct = Math.round(done/o.tasks.length*100), nm = o.emp?empName(o.emp):o.name;
    return `<div class="card"><div class="row sp"><div class="row">${o.emp?av(o.emp,36):''}<div><b>${esc(nm)}</b><div class="small muted">Start ${fmt(o.start)}${o.orient?' · Orientation '+fmt(o.orient):''}</div></div></div><span>${pct===100?badge('Complete','ok'):badge(pct+'%','warn')}</span></div><div class="prog ${pct===100?'g':''}" style="margin:10px 0"><i style="width:${pct}%"></i></div>
    ${o.tasks.map((t,i)=>`<label class="li" style="cursor:pointer;margin:0"><input type="checkbox" style="width:auto" data-chg="obTask" data-id="${o.id}" data-i="${i}" ${t.d?'checked':''}><span class="grow" style="${t.d?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.t)}</span></label>`).join('')}
    <div class="row" style="margin-top:10px"><input type="date" style="width:160px" id="or-${o.id}" value="${o.orient||''}"><button class="btn sm" data-act="orient" data-id="${o.id}">Schedule orientation</button></div></div>`; }).join('');
  const ex = DB.exits.map(x => { const e = emp(x.emp), cl = x.clear, all = Object.values(cl).every(Boolean); return `<div class="card"><div class="row sp"><div class="row">${av(e,36)}<div><b>${esc(e.name)}</b><div class="small muted">${esc(x.type)} · last day ${fmt(x.last)} · ${esc(x.reason)}</div></div></div>${all&&x.settlement==='Paid'?badge('Closed','ok'):badge('In progress','warn')}</div>
    <h4 style="margin:12px 0 6px">Clearance</h4>${Object.keys(cl).map(d=>`<label class="li" style="cursor:pointer;margin:0"><input type="checkbox" style="width:auto" data-chg="clear" data-id="${x.id}" data-d="${d}" ${cl[d]?'checked':''}> ${d}</label>`).join('')}
    <dl class="dl" style="margin-top:10px"><dt>Holiday accrual</dt><dd>${num1(x.accrual)} days to pay / deduct</dd><dt>Assets</dt><dd>${esc(x.assets)||'—'}</dd><dt>Exit interview</dt><dd>${esc(x.interview)||'<i>Not recorded</i>'}</dd><dt>Final settlement</dt><dd><select data-chg="settle" data-id="${x.id}" style="width:auto">${['Pending','Calculated','Approved','Paid'].map(s=>`<option ${x.settlement===s?'selected':''}>${s}</option>`).join('')}</select></dd></dl></div>`; }).join('');
  const reasons = {}; DB.exits.forEach(x=>reasons[x.reason]=(reasons[x.reason]||0)+1);
  return pageHead('Onboarding & Exit','New-starter checklists, IT automation, and a structured leaver clearance workflow.',`<button class="btn pri" data-act="${k==='on'?'newStarter':'newExit'}">${ico('plus')} ${k==='on'?'New starter':'Record resignation'}</button>`) + tabsHtml('onb',[['on','Onboarding'],['sp','Starter packs'],['ex','Exit & clearance']],'on') + (k==='on'?`<div class="grid g2">${on||'<div class="empty">No starters.</div>'}</div>`:`<div class="grid g2">${ex||'<div class="empty">No leavers.</div>'}</div><div class="card" style="margin-top:16px"><h3>Resignation analytics</h3>${Object.entries(reasons).map(([r,n])=>`<div class="hbar"><span>${esc(r)}</span><div class="prog"><i style="width:${n/DB.exits.length*100}%"></i></div><b>${n}</b></div>`).join('')||'<span class="muted">No data</span>'}</div>`);
};
CHG.obTask = el => { const o = DB.onboarding.find(x=>x.id===el.dataset.id), t = o.tasks[+el.dataset.i]; t.d = el.checked?1:0; if(el.checked){ if(/IT account/.test(t.t)) notify(DB.emps.filter(e=>e.depts.includes('IT')&&e.role==='manager').map(e=>e.id), `IT: set up account and equipment for ${o.emp?empName(o.emp):o.name}.`, 'dashboard'); if(/One Bill/.test(t.t)) toast('Credentials email queued to One Bill (simulated)'); } log('Onboarding task', `${t.t}: ${el.checked?'done':'reopened'}`, o.emp); saveDB(); render(); };

ACT.newExit = () => modal({title:'Record resignation / exit',body:`<form id="xf"><div class="fgrid"><div class="field full"><label>Employee</label><select name="e">${empOptions(DB.emps.filter(e=>e.status==='active'))}</select></div><div class="field"><label>Notice given</label><input type="date" name="n" value="${D.todayIso()}"></div><div class="field"><label>Last working day</label><input type="date" name="l"></div><div class="field"><label>Type</label><select name="t"><option>Resignation</option><option>Dismissal</option><option>End of contract</option><option>Retirement</option></select></div><div class="field"><label>Reason</label><select name="r">${['Career progression','Relocation','Pay','Work-life balance','Personal reasons','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div id="xe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Save',cls:'pri',act:'saveExit'}]});
ACT.saveExit = el => submitOnce(el, () => { const f = $('#xf'), er = $('#xe'); const e = emp(f.e.value); if(!f.l.value || f.l.value<f.n.value){ er.textContent='Last working day must be on or after the notice date.'; er.classList.add('show'); return; }
  if(DB.exits.some(x=>x.emp===e.id)){ er.textContent='An exit is already recorded for this employee (duplicate save prevented).'; er.classList.add('show'); return; }
  const lv = f.l.value, y = leaveYearOf(e, lv); const tmp = {...e, leaveDate:lv}; const acc = accrued(tmp,y,D.parse(lv)) + ((e.carry||{})[y]||0), b = balance(tmp,y); const bal = Math.round((acc - b.taken - b.upcoming - b.pending*0)*2)/2;
  DB.exits.push({id:uid('ex'),emp:e.id,type:f.t.value,notice:f.n.value,last:lv,reason:f.r.value,clear:{IT:false,Finance:false,'Line Manager':false},assets:'',settlement:'Pending',interview:'',accrual:bal});
  e.leaveDate = lv; e.history.unshift({t:nowStamp(),by:me().name,what:`Exit recorded – last day ${lv}`}); if(lv<=D.todayIso()) e.status='leaver'; log('Exit recorded',f.t.value+' '+lv,e.id); notify(DB.emps.filter(x=>x.role==='admin').map(x=>x.id), `Finance/IT clearance emails queued for ${e.name} (simulated).`,'onboarding'); saveDB(); closeModal(); toast('Exit recorded – clearance workflow started','ok'); render(); });

const LADDER = ['Investigation','Hearing','Verbal warning','Written warning','Final written warning','Dismissal','No action'];
VIEWS.cases = () => {
  const k = tabOf('cs','list'); const vis = DB.cases.filter(c => isHR() || manageable().some(m=>m.id===c.emp));
  let body = '';
  if(k==='list') body = table([{h:'Case',f:c=>`<b>${c.id}</b>`},{h:'Type',f:c=>badge(c.type,c.type==='Grievance'?'pur':'info')},{h:'Employee',f:c=>esc(empName(c.emp))},{h:'Raised',f:c=>fmt(c.raised)},{h:'Stage',f:c=>esc(c.stage)},{h:'Owner',f:c=>esc(empName(c.owner))},{h:'Status',f:c=>statusBadge(c.status)},{h:'',cls:'right',f:c=>`<button class="btn sm" data-act="openCase" data-id="${c.id}">Open</button>`}], vis);
  else { const pe = DB.emps.filter(e=>vis.some(c=>c.emp===e.id) || (isHR() && e.disc.length)); body = `<div class="banner info">${ico('help')}<span>Disciplinary matrix: current warning level per employee from case records and history. Warning expiry periods are set by policy – HR to confirm.</span></div>` + table([{h:'Employee',f:e=>esc(e.name)},{h:'Department',f:e=>esc(e.depts.join(' / '))},...LADDER.slice(2,6).map(l=>({h:l.replace(' warning','').replace('Final written','Final'),cls:'right',f:e=>{ const n = e.disc.filter(d=>d.level===l).length + DB.cases.filter(c=>c.emp===e.id&&c.stage===l).length; return n?badge(String(n),l.startsWith('Final')?'bad':'warn'):'<span class="muted">–</span>'; }})),{h:'Dismissal',cls:'right',f:e=>DB.cases.filter(c=>c.emp===e.id&&c.stage==='Dismissal').length||'–'}], pe); }
  return pageHead('Grievance & Disciplinary','One case-management record per matter, with role-based visibility, timeline and legal documents.',`<button class="btn pri" data-act="newCase">${ico('plus')} Open case</button>`) + tabsHtml('cs',[['list','Cases'],['matrix','Disciplinary matrix']],'list') + `<div class="banner">${ico('lock')}<span>Restricted. Managers see cases for their team (without legal documents); HR sees all. Decisions require human approval and specialist HR/legal review.</span></div>` + body;
};

ACT.openCase = el => { const c = DB.cases.find(x=>x.id===el.dataset.id), e = emp(c.emp);
  modal({title:`${c.id} – ${c.type}`,size:'wide',body:`<div class="row sp"><div class="row">${av(e,40)}<div><b>${esc(e.name)}</b><div class="small muted">${esc(e.depts.join(' / '))}</div></div></div>${statusBadge(c.status)}</div><p>${esc(c.summary)}</p>
  <div class="grid g2"><div><h4>Timeline</h4><div class="tl" style="margin-top:10px">${c.timeline.slice().reverse().map(t=>`<div class="e"><b>${esc(t.w)}</b><div class="small muted">${fmt(t.t)}</div></div>`).join('')}</div></div>
  <div><h4>Stage</h4><p>${esc(c.stage)}</p>${isHR()?`<h4>Legal documentation</h4><div style="margin:6px 0">${c.legal.map(l=>`<span class="tag">${esc(l)}</span>`).join('')||'<span class="muted">None</span>'}</div>`:''}</div></div>
  ${isHR()&&c.status==='Open'?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="fgrid"><div class="field"><label>Add timeline note</label><input id="ctn" placeholder="e.g. Hearing held"></div><div class="field"><label>Outcome / stage</label><select id="cst">${LADDER.map(l=>`<option ${l===c.stage?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Attach document (name)</label><input id="cdoc" placeholder="e.g. Outcome letter"></div></div>`:''}`,

ACT.caseSave = el => { const c = DB.cases.find(x=>x.id===el.dataset.id), n = $('#ctn').value.trim(), s = $('#cst').value, d = $('#cdoc').value.trim(); if(s!==c.stage){ c.stage = s; c.timeline.push({t:D.todayIso(),w:'Stage: '+s}); if(['Verbal warning','Written warning','Final written warning'].includes(s)) emp(c.emp).disc.push({date:D.todayIso(),level:s,reason:c.summary.slice(0,60)}); } if(n) c.timeline.push({t:D.todayIso(),w:n}); if(d) c.legal.push(d); log('Case updated',c.id,c.emp); saveDB(); closeModal(); toast('Case updated','ok'); render(); };

const TCATS = ['Salary Issues','Payslip Issues','Asset Requests','Queries'];
VIEWS.helpdesk = () => {
  DB.tickets.forEach(t => { if(!['Resolved','Escalated'].includes(t.status) && D.diff(t.raised,D.todayIso())>t.sla){ t.status='Escalated'; t.escalatedOn = D.todayIso(); notify(DB.emps.filter(e=>e.role==='admin').map(e=>e.id), `Ticket ${t.id} breached its SLA and was auto-escalated.`, 'helpdesk'); log('Ticket auto-escalated',t.id,t.emp); } }); saveDB();
  const list = DB.tickets.filter(t => isHR() || t.emp===SESSION.uid).sort((a,b)=>b.raised.localeCompare(a.raised));
  const res = DB.tickets.filter(t=>t.status==='Resolved' && t.resolved); const avg = res.length ? (res.reduce((s,t)=>s+D.diff(t.raised,t.resolved),0)/res.length).toFixed(1) : '—';
  return pageHead('Employee Helpdesk','Raise salary, payslip, asset and general queries. SLA tracking and auto-escalation apply.',`<button class="btn pri" data-act="newTicket">${ico('plus')} New ticket</button>`) +
  (isHR()?`<div class="grid g4" style="margin-bottom:16px">${[['Open',DB.tickets.filter(t=>t.status==='Open').length],['Escalated',DB.tickets.filter(t=>t.status==='Escalated').length],['Resolved',DB.tickets.filter(t=>t.status==='Resolved').length],['Avg days to resolve',avg]].map(([t,n])=>`<div class="card kpi"><span class="t">${t}</span><span class="v">${n}</span></div>`).join('')}</div>`:'') +
  table([{h:'Ticket',f:t=>`<b>${t.id}</b>`},{h:'Subject',f:t=>`${esc(t.subject)}<div class="small muted">${esc(t.cat)} · ${esc(empName(t.emp))}</div>`},{h:'Priority',f:t=>badge(t.pri,t.pri==='High'?'bad':t.pri==='Medium'?'warn':'')},{h:'Raised',f:t=>fmt(t.raised)},{h:'SLA',f:t=>t.status==='Resolved'?'—':(D.diff(t.raised,D.todayIso())>t.sla?badge('Breached','bad'):badge(`${t.sla-D.diff(t.raised,D.todayIso())}d left`,'ok'))},{h:'Status',f:t=>statusBadge(t.status)},{h:'',cls:'right',f:t=>`<button class="btn sm" data-act="openTicket" data-id="${t.id}">Open</button>`}], list);
};
ACT.newTicket = () => modal({title:'New ticket',body:`<form id="tf"><div class="fgrid"><div class="field"><label>Category</label><select name="c">${TCATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="p"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="field full"><label>Subject</label><input name="s" maxlength="100"></div><div class="field full"><label>Details</label><textarea name="d"></textarea></div></div><p class="small muted">Do not include bank details or passwords.</p><div id="tfe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Submit',cls:'pri',act:'saveTicket'}]});
ACT.saveTicket = el => submitOnce(el, () => { const f = $('#tf'); if(f.s.value.trim().length<4 || f.d.value.trim().length<5){ const er = $('#tfe'); er.textContent='Enter a subject and some details.'; er.classList.add('show'); return; }
  const id = 'T-'+(3001+DB.tickets.length); DB.tickets.push({id,cat:f.c.value,emp:SESSION.uid,subject:f.s.value.trim(),raised:D.todayIso(),sla:f.c.value==='Asset Requests'?5:3,status:'Open',pri:f.p.value,owner:DB.emps.find(e=>e.role==='hr').id,thread:[{w:me().name,t:D.todayIso(),m:f.d.value.trim()}]}); notify(DB.emps.filter(e=>e.role==='hr'||e.role==='admin').map(e=>e.id), `New ticket ${id}: ${f.s.value.trim()}`, 'helpdesk'); log('Ticket raised',id); saveDB(); closeModal(); toast('Ticket '+id+' raised','ok'); render(); });
ACT.openTicket = el => { const t = DB.tickets.find(x=>x.id===el.dataset.id);
  modal({title:`${t.id} – ${esc(t.subject)}`,size:'wide',body:`<div class="row wrap" style="margin-bottom:10px">${statusBadge(t.status)} ${badge(t.cat)} ${badge(t.pri+' priority')}</div><div class="list">${t.thread.map(m=>`<div class="li" style="align-items:flex-start"><div class="grow"><b>${esc(m.w)}</b> <span class="small muted">${fmt(m.t)}</span><div>${esc(m.m)}</div></div></div>`).join('')}</div>${t.status!=='Resolved'?`<div class="field" style="margin-top:12px"><label>Reply</label><textarea id="tr"></textarea></div>`:''}`,
  actions:[{label:'Close',act:'closeModal'},...(t.status!=='Resolved'?[{label:'Send reply',act:'ticketReply',data:`data-id="${t.id}"`},...(isHR()?[{label:'Resolve',cls:'ok',act:'ticketResolve',data:`data-id="${t.id}"`}]:[])]:[])]}); };
ACT.ticketReply = el => { const t = DB.tickets.find(x=>x.id===el.dataset.id), m = $('#tr').value.trim(); if(!m) return toast('Write a reply first.','bad'); t.thread.push({w:me().name,t:D.todayIso(),m}); notify(me().id===t.emp?DB.emps.filter(e=>e.role==='hr').map(e=>e.id):[t.emp], `New reply on ticket ${t.id}`, 'helpdesk'); saveDB(); closeModal(); render(); };

ACT.newDed = () => modal({title:'Raise deduction',body:`<form id="df"><div class="fgrid"><div class="field full"><label>Employee</label><select name="e">${empOptions(isHR()?DB.emps.filter(e=>e.status==='active'):manageable().filter(e=>e.status==='active'))}</select></div><div class="field"><label>Type</label><select name="t">${['Uniform replacement','Fuel card misuse','Overpayment recovery','Loan repayment','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (£, GBP)</label><input type="number" name="a" min="0.01" step="0.01"></div><div class="field"><label>Date</label><input type="date" name="d" value="${D.todayIso()}"></div><div class="field full"><label>Description</label><textarea name="s"></textarea></div></div><div id="dfe" class="err"></div></form>`,actions:[{label:'Cancel',act:'closeModal'},{label:'Submit for approval',cls:'pri',act:'saveDed'}]});
ACT.saveDed = el => submitOnce(el, () => { const f = $('#df'), a = +f.a.value; if(!(a>0) || f.s.value.trim().length<5){ const er = $('#dfe'); er.textContent='Enter a positive amount and a description.'; er.classList.add('show'); return; }
